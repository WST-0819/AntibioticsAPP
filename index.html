s.push({start:0,dose:LD,vd:Vd*1.25}); t0=gap; }\n  for(let st=t0; st<tEnd-1e-9; st+=tau) events.push({start:st,dose,vd:Vd});\n  const pts=[], step=Math.max(0.05,tEnd/1200);\n  for(let t=0;t<=tEnd+1e-9;t+=step){\n    let c=0;\n    for(const e of events){\n      const ti=Tinf(e.dose); if(t<=e.start) continue;\n      if(t<e.start+ti) c+=(e.dose/ti)/(Ke*e.vd)*(1-EXP(-Ke*(t-e.start)));\n      else c+=(e.dose/ti)/(Ke*e.vd)*(1-EXP(-Ke*ti))*EXP(-Ke*(t-e.start-ti));\n    }\n    pts.push([t,c]);\n  }\n  return pts;\n}\nfunction redrawChart(ctx){\n  const c=$('chart_'+ctx), g=c.getContext('2d');\n  const st=S[ctx], pk=st.pk;\n  if(!pk||!$('page-'+ctx).classList.contains('on')){ g.clearRect(0,0,c.width,c.height); return; }\n  useRate(ctx);\n  const LD=ctx==='init'?(parseFloat($('ld').value)||0):0, gap=ctx==='init'?(num('ldgap')||0):0;\n  const cur={dose:num(IN[ctx][0]),tau:parseFloat($(IN[ctx][1]).value)};\n  const list=[]; if(cur.dose>0&&cur.tau>0) list.push(cur);\n  st.list.forEach(x=>{ if(!list.some(y=>y.dose===x.dose&&y.tau===x.tau)) list.push(x); });\n  const W=c.width=c.clientWidth*2, H=c.height=520;\n  g.clearRect(0,0,W,H); if(!list.length) return;\n  const maxTau=Math.max(...list.map(x=>x.tau));\n  const tEnd=Math.max(72,Math.ceil(((LD>0?gap:0)+maxTau*3)/24)*24);\n  const series=list.map((x,i)=>({...x,pts:seriesCurve(pk,x.dose,x.tau,LD,gap,tEnd),color:SERIES_COLORS[i%SERIES_COLORS.length]}));\n  const maxY=Math.max(40,Math.ceil(Math.max(...series.flatMap(s=>s.pts.map(p=>p[1])))/10)*10);\n  const pad=90, w=W-pad*1.4, h=H-pad*1.5-40;\n  const X=t=>pad+t/tEnd*w, Y=v=>H-pad/1.5-v/maxY*h;\n  const css=getComputedStyle(document.body);\n  const ink=css.getPropertyValue('--ink')||'#000', line=css.getPropertyValue('--line')||'#ddd';\n  g.strokeStyle=line; g.lineWidth=1; g.fillStyle=ink; g.font='26px sans-serif'; g.textAlign='right';\n  for(let v=0;v<=maxY;v+=10){ g.beginPath(); g.moveTo(pad,Y(v)); g.lineTo(pad+w,Y(v)); g.stroke(); g.fillText(v,pad-12,Y(v)+9); }\n  {\n    const tg=goal(ctx); g.fillStyle='rgba(15,123,79,0.08)'; g.fillRect(pad,Y(tg.hi),w,Y(tg.lo)-Y(tg.hi)); g.fillStyle=ink;\n  }\n  for(let tt=0;tt<=tEnd;tt+=Math.max(6,Math.round(tEnd/8/6)*6)) {g.textAlign='center'; g.fillText(tt,X(tt),H-52);}\n  g.font='bold 28px sans-serif'; g.textAlign='left'; g.fillText('濃度 (mcg/mL)',pad-60,32); g.textAlign='right'; g.fillText('時間 (小時)',pad+w,H-90); g.font='26px sans-serif'; g.textAlign='left';\n  series.forEach(s=>{\n    g.strokeStyle=s.color; g.lineWidth=3; g.beginPath();\n    s.pts.forEach((p,i)=> i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1]))); g.stroke();\n  });\n  let lx=pad;\n  series.forEach(s=>{\n    const label=`${s.dose} mg q${s.tau}h`;\n    g.fillStyle=s.color; g.fillRect(lx,H-22,28,8); g.fillStyle=ink; g.fillText(label,lx+36,H-10);\n    lx+=36+g.measureText(label).width+30;\n  });\n}\n\n/* ===== 事件 ===== */\nObject.entries(IN).forEach(([k,[di,ti]])=>{\n  $(di).addEventListener('input',()=>{S[k].td=true;});\n  $(ti).addEventListener('input',()=>{S[k].tt=true;});\n});\n/* HH:MM 自動補冒號 */\n['s_t1','s_t2','q_h0','q_h1','q_h2','q_h3'].forEach(id=>$(id).addEventListener('input',e=>{\n  const v=e.target.value.replace(/[^\\d:]/g,'');\n  e.target.value = (/^\\d{3,4}$/.test(v)&&!v.includes(':')&&v.length===4)? v.slice(0,2)+':'+v.slice(2) : v;\n}));\ndocument.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',run));\nwindow.addEventListener('resize',()=>redrawChart(curPage));\n['s_d1','s_d2','q_d0','q_d1','q_d2','q_d3'].forEach(id=>$(id).value=today());\naddTips();\nrun();\n<\/script>\n<script>\n/* 由抗生素查詢系統帶入病人資料 */\nfunction applyPT(pt){\n  if(!pt) return;\n  const set=(id,v)=>{const el=document.getElementById(id); if(el&&v!=null&&v!==''){el.value=v;}};\n  ['','t_'].forEach(p=>{\n    set(p+'age',pt.age); set(p+'scr',pt.scr); set(p+'ht',pt.ht); set(p+'wt',pt.wt);\n    const r=document.querySelector('input[name='+p+'sex][value='+(pt.sex==='F'?'F':'M')+']'); if(r) r.checked=true;\n  });\n  if(document.getElementById('uScr')) document.getElementById('uScr').value='mg/dL';\n  if(document.getElementById('uHt')) document.getElementById('uHt').value='cm';\n  if(document.getElementById('uWt')) document.getElementById('uWt').value='kg';\n  if(['age','scr','ht','wt'].every(k=>parseFloat(pt[k])>0)) calc(); else run();\n}\naddEventListener('message',e=>{ if(e.data&&e.data.type==='abx-pt') applyPT(e.data.pt); });\napplyPT(window.__ABX_PT);\n<\/script>\n<\/body>\n<\/html>\n" };
const BUILTIN_TITLE = { vanco: "Vancomycin 計算器" };
const SHEET_ID = "15JAyvXkQbDUWUPUpz2ZCQUw373DtBDLCbQqFdrPemCw";
const GID = "1596306221"; // 成人
const BASIC_COLS = 9;     // A-I

let HEAD = [], ROWS = [], GROUPS = [], COLG = [], MODE = 0;
let ROUTES = [], ROUTE_SEL = [];   // 給藥途徑清單／目前勾選（空 = 全部） // -1 = 個人化建議，0 = 基本資訊，1.. = GROUPS[i-1]

/* ---------- 讀取試算表（JSONP，免 CORS） ---------- */
let _jsonpSeq = 0;
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = "__abx_cb" + (++_jsonpSeq) + "_" + Date.now();   // 每次請求用獨立回呼
    const s = document.createElement("script");
    let done = false;
    const finish = () => { done = true; clearTimeout(timer); delete window[cb]; s.remove(); };
    window[cb] = d => { if (done) return; finish(); res(d); };
    s.src = url + "&tqx=out:json;responseHandler:" + cb;
    s.onerror = () => { if (done) return; finish(); rej(new Error("無法連線至 Google 試算表")); };
    const timer = setTimeout(() => { if (done) return; finish(); rej(new Error("載入逾時")); }, 20000);
    document.head.appendChild(s);
  });
}
let _loading = null;
async function load(manual){
  if (_loading) return _loading;              // 進行中就不重複發送
  const st = document.getElementById("status"), btn = document.getElementById("load");
  st.textContent = "載入中…";
  btn.disabled = true; btn.textContent = "載入中…";
  _loading = (async () => {
    try{
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=0&t=${Date.now()}`;
      const data = await jsonp(url);
      if (!data || data.status === "error" || !data.table){
        const m = data && data.errors && data.errors[0];
        throw new Error(m ? (m.detailed_message || m.message || m.reason) : "試算表沒有回傳資料");
      }
      const raw = data.table.rows.map(r => (r.c || []).map(c => (c && c.v != null) ? String(c.v) : ""));
      parse(raw);
      try{ localStorage.setItem("abx_cache", JSON.stringify({raw, ts: Date.now()})); }catch(e){}
      document.getElementById("meta").textContent =
        `共 ${ROWS.length} 筆・更新於 ${new Date().toLocaleString("zh-TW")}`;
      st.textContent = "";
      renderTabs(); renderRoutes(); render();
      if (manual){ st.textContent = `✓ 已更新，共 ${ROWS.length} 筆`;
        setTimeout(() => { if (st.textContent.startsWith("✓")) st.textContent = ""; }, 3000); }
    }catch(err){
      st.textContent = "載入失敗：" + err.message +
        (ROWS.length ? "（目前顯示的是先前快取的資料）" : "") +
        "（請確認已登入可存取此試算表的 Google 帳號，或將試算表設為「知道連結的人可檢視」）";
    }finally{
      btn.disabled = false; btn.textContent = "載入 / 更新資料"; _loading = null;
    }
  })();
  return _loading;
}

function parse(raw){
  const g = raw[0] || [], h = raw[1] || [];
  const width = Math.max(g.length, h.length);
  HEAD = []; for (let i = 0; i < width; i++) HEAD.push((h[i] || "").trim());
  GROUPS = []; let cur = null;
  for (let i = BASIC_COLS; i < width; i++){
    const label = (g[i] || "").trim();
    if (label){ cur = {title: label, cols: []}; GROUPS.push(cur); }
    if (!cur){ cur = {title: "其他", cols: []}; GROUPS.push(cur); }
    if (HEAD[i]) cur.cols.push(i);
  }
  GROUPS = GROUPS.filter(x => x.cols.length);
  // 修正：若某分類標題位置偏移，導致「資料來源」被歸到下一個分類，
  // 而前一個分類本身沒有「資料來源」欄，則把它歸還給前一個分類。
  for (let i = 1; i < GROUPS.length; i++){
    const c2 = GROUPS[i], prev = GROUPS[i-1];
    const isSrc = c => /資料來源|reference|來源/i.test(HEAD[c] || "");
    if (c2.cols.length && isSrc(c2.cols[0]) && !prev.cols.some(isSrc)){
      prev.cols.push(c2.cols.shift());
    }
  }
  GROUPS = GROUPS.filter(x => x.cols.length);
  COLG = []; GROUPS.forEach(g2 => g2.cols.forEach(c => COLG[c] = g2));
  Object.keys(_famCache).forEach(k => delete _famCache[k]);
  computeAvail();
  ROWS = raw.slice(2).filter(r => (r[0] || "").trim() || (r[1] || "").trim());
  buildRoutes();
  if (MODE > GROUPS.length) MODE = 0;
}

/* =========================================================
   病人資訊 / 計算
   ========================================================= */
const PT = {age:"", sex:"M", ht:"", wt:"", scr:"", wsel:"tbw", crclman:"",
            dial:"none", ecmo:"no", crit:"no", cp:""};
const PIDS = {age:"p_age", sex:"p_sex", ht:"p_ht", wt:"p_wt", scr:"p_scr", wsel:"p_wsel",
              crclman:"p_crclman", dial:"p_dial", ecmo:"p_ecmo",
              crit:"p_crit", cp:"p_cp"};
const DEF = {sex:"M", wsel:"tbw", dial:"none", ecmo:"no", crit:"no"};

function ptLoad(){
  try{
    const s = JSON.parse(localStorage.getItem("abx_patient") || "null");
    if (s) Object.keys(PT).forEach(k => { if (s[k] != null) PT[k] = s[k]; });
  }catch(e){}
  Object.keys(PIDS).forEach(k => { const el = document.getElementById(PIDS[k]); if (el) el.value = PT[k]; });
}
function ptSave(){ try{ localStorage.setItem("abx_patient", JSON.stringify(PT)); }catch(e){} }

const num = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : null; };

function calc(){
  const age = num(PT.age), ht = num(PT.ht), wt = num(PT.wt), scr = num(PT.scr);
  const female = PT.sex === "F";
  const o = {age, ht, wt, scr, female, dial: PT.dial,
             ecmo: PT.ecmo === "yes", crit: PT.crit === "yes", cp: PT.cp};
  // Devine 公式只在身高 ≥152 cm 成立，兒童／極矮身材不套用，避免算出荒謬的 IBW
  if (ht && ht >= 152){
    const inch = ht / 2.54;
    o.ibw = (female ? 45.5 : 50) + 2.3 * (inch - 60);
  } else if (ht) o.ibwNA = true;
  if (wt && o.ibw) o.adj = wt > o.ibw ? o.ibw + 0.4 * (wt - o.ibw) : wt;
  if (wt && ht){
    o.bsa = 0.007184 * Math.pow(ht, 0.725) * Math.pow(wt, 0.425);
    o.bmi = wt / Math.pow(ht / 100, 2);
  }
  if (wt){
    // 由使用者選定 CG 要代入哪一種體重；選到算不出來的就退回實際體重並提示
    const want = PT.wsel || "tbw";
    const map = {tbw:{w:wt, tag:"TBW"}, ibw:{w:o.ibw, tag:"IBW"}, adj:{w:o.adj, tag:"AdjBW"}};
    let pick = map[want] || map.tbw;
    if (pick.w == null){ o.wselFallback = want; pick = map.tbw; }
    o.cw = pick.w; o.cwtag = pick.tag;
  }
  // Cockcroft-Gault 只適用成人；兒童不套用，改由 Schwartz 代用。三種體重各算一次供對照。
  if (age != null && age >= 18 && scr){
    const cg = w => w ? Math.max(0, ((140 - age) * w) / (72 * scr) * (female ? 0.85 : 1)) : null;
    o.cgTBW = cg(wt); o.cgIBW = cg(o.ibw); o.cgAdj = cg(o.adj);
    o.cg = cg(o.cw);
  }
  const peds = age != null && age < 18;
  // --- 各家公式 ---
  // Schwartz bedside（兒童）：eGFR = 0.413 × 身高(cm) / SCr
  if (ht && scr) o.schw = 0.413 * ht / scr;
  // CKD-EPI 2021（無種族係數）
  if (age && scr){
    const k = female ? 0.7 : 0.9, al = female ? -0.241 : -0.302;
    o.epi = 142 * Math.pow(Math.min(scr / k, 1), al) * Math.pow(Math.max(scr / k, 1), -1.200)
              * Math.pow(0.9938, age) * (female ? 1.012 : 1);
  }
  // MDRD 4-variable（IDMS）：不套用種族係數
  if (age && scr) o.mdrd = 175 * Math.pow(scr, -1.154) * Math.pow(age, -0.203) * (female ? 0.742 : 1);

  const man = num(PT.crclman);
  // --- CrCl 變數（表中寫 CrCl / CCr 時使用）---
  if (man != null){ o.vCrCl = man; o.crclSrc = "手動指定"; }
  else if (o.cg != null){ o.vCrCl = o.cg; o.crclSrc = "CG/" + o.cwtag; }
  else if (peds && o.schw != null){ o.vCrCl = o.schw; o.crclSrc = "Schwartz（代用）"; o.crclProxy = true; }
  else { o.vCrCl = null; o.crclSrc = ""; }

  // --- eGFR 變數（表中寫 eGFR / GFR 時使用）---
  // 成人採 MDRD，CKD-EPI 併列對照；兒童採 Schwartz
  const f = peds ? "schwartz" : "mdrd";
  o.egfrFormula = f;
  const pick = {epi:o.epi, mdrd:o.mdrd, schwartz:o.schw}[f];
  if (pick != null){ o.vEgfr = pick; o.egfrSrc = {epi:"CKD-EPI 2021", mdrd:"MDRD", schwartz:"Schwartz k=0.413"}[f]; }
  else if (o.epi != null){ o.vEgfr = o.epi; o.egfrSrc = "CKD-EPI 2021"; }
  else if (o.vCrCl != null){ o.vEgfr = o.vCrCl; o.egfrSrc = "以 CrCl 代用"; o.egfrProxy = true; }
  else { o.vEgfr = null; o.egfrSrc = ""; }

  // 顯示用的主要腎功能值：有 CrCl 就以 CrCl 為主
  o.crcl = o.vCrCl != null ? o.vCrCl : o.vEgfr;
  o.schwUsed = o.crclProxy === true;
  o.crclUnit = o.vCrCl != null ? "mL/min" : "mL/min/1.73m²";
  if (o.vCrCl == null && o.vEgfr != null) o.crclSrc = o.egfrSrc;
  if (o.bsa && o.vEgfr != null && !o.egfrProxy) o.egfrAbs = o.vEgfr * o.bsa / 1.73;
  return o;
}
const r1 = n => (Math.round(n * 10) / 10).toFixed(1);
// 未滿 2 歲改以月齡顯示，避免「0.17 歲」這種不好讀的寫法
const ageTxt = a => a == null ? "" : (a < 2 ? Math.round(a * 12) + " 個月" : r1(a).replace(/\.0$/, "") + " 歲");

/* =========================================================
   特性（traits）定義
   active : 這位病人是否符合此特性
   note   : 顯示在結論中的條件說明
   colRe  : 哪些欄位／分類標題屬於此特性
   kind   : "cond" = 需逐條比對數值條件；"plain" = 整欄視為該族群建議
   ========================================================= */
const TRAITS = [
  {key:"dial",  label:"腎臟替代治療", fam:"dialysis", base:true, basePri:2, kind:"cond",
   active:p => p.dial !== "none",
   note:p => p.dial,
   colRe:/透析|洗腎|dialy|\bi?hd\b|capd|apd|\bpd\b|腹膜|cvvh|crrt|scuf|sled/i,
   colFilter:c => modalityOf(c) === PT.dial},

  {key:"renal", label:"腎功能", fam:"renal", base:true, basePri:3, kind:"cond",
   active:p => p.dial === "none" && (p.vCrCl != null || p.vEgfr != null),
   note:p => [p.vCrCl != null ? "CrCl " + r1(p.vCrCl) : "",
              p.vEgfr != null ? "eGFR " + r1(p.vEgfr) : ""].filter(Boolean).join("／"),
   colRe:/腎功能|renal|crcl|egfr|ccr|腎臟功能|腎功能調整/i},

  {key:"obese", label:"肥胖", kind:"plain",
   active:p => (p.age == null || p.age >= 18) &&
               ((p.bmi != null && p.bmi >= 30) || (p.ibw && p.wt && p.wt > 1.2 * p.ibw)),
   note:p => (p.bmi != null ? "BMI " + r1(p.bmi) : "") +
             (p.ibw && p.wt > 1.2 * p.ibw ? (p.bmi != null ? "、" : "") + "TBW > 1.2×IBW" : ""),
   colRe:/肥胖|過重|obes|overweight|bmi|體重過重|high\s*body\s*weight/i},

  {key:"low",   label:"低體重", kind:"plain",
   active:p => (p.age == null || p.age >= 18) && p.bmi != null && p.bmi < 18.5,
   note:p => "BMI " + r1(p.bmi),
   colRe:/低體重|體重過輕|消瘦|underweight|cachex|low\s*body\s*weight/i},

  {key:"ecmo",  label:"ECMO", kind:"plain",
   active:p => p.ecmo, note:() => "使用中",
   colRe:/ecmo|體外膜|葉克膜|extracorporeal/i},

  {key:"crit",  label:"重症 / 敗血症", kind:"plain",
   active:p => p.crit, note:() => "重症／敗血症",
   colRe:/重症|敗血|septic|sepsis|critical|icu|augmented\s*renal|arc\b/i},

  {key:"hep",   label:"肝功能", kind:"plain",
   active:() => false, note:() => "共通資訊",   // 不需填寫；內容於結論中直接列出
   colRe:/肝功能|肝?硬化|child|pugh|hepatic|cirrho/i},

  {key:"peds",  label:"兒科", base:true, basePri:1, kind:"plain",
   active:p => p.age != null && p.age < 18,
   note:p => ageTxt(p.age),
   colRe:/兒|小兒|幼兒|新生|pediatr|paediatr|neonat|infant/i},

  {key:"elder", label:"高齡", kind:"plain",
   active:p => p.age != null && p.age >= 75,
   note:p => ageTxt(p.age),
   colRe:/高齡|老年|年長|elderly|geriatric/i}
];

function colText(c){ return (HEAD[c] || "") + " " + ((COLG[c] && COLG[c].title) || ""); }
const isSrcCol = c => /資料來源|reference|來源/i.test(HEAD[c] || "");
const famOf = t => t.fam || t.key;
// 欄位歸屬：特定族群優先於籠統的腎功能字樣，一欄只歸一個族群，避免「肥胖劑量調整」被腎功能搶走
const COL_PRIORITY = ["peds","obese","low","ecmo","crit","hep","elder","dialysis","renal"];
// 透析欄位屬於哪一種治療模式（順序很重要：CAPD/CVVH 的分類名稱裡也含「血液透析」字樣）
function modalityOf(c){
  const t = colText(c);
  if (/cvvh|crrt|scuf|持續性/i.test(t)) return "CRRT";
  if (/capd|apd|ccpd|腹膜|(^|[^a-z])pd([^a-z]|$)/i.test(t)) return "PD";
  if (/sled|eddf/i.test(t)) return "SLED";
  if (/(^|[^a-z])i?hd([^a-z]|$)|血液透析|血透|洗腎|hemodialy/i.test(t)) return "HD";
  return null;
}
const _famCache = {};
function colFam(c){
  if (!HEAD[c] || isSrcCol(c)) return null;
  const txt = colText(c);
  if (_famCache[txt] !== undefined) return _famCache[txt];
  let hit = null;
  for (const f of COL_PRIORITY){
    const t = TRAITS.find(x => famOf(x) === f);
    if (t && t.colRe.test(txt)){ hit = f; break; }
  }
  return (_famCache[txt] = hit);
}
function traitCols(t){
  const out = [], f = famOf(t);
  for (let c = 0; c < HEAD.length; c++){
    if (colFam(c) !== f) continue;
    if (t.colFilter && !t.colFilter(c)) continue;
    out.push(c);
  }
  return out;
}
// 某欄屬於哪些特性（用於總表就地標色 & 排除基礎劑量欄）
function colTraits(c){
  const f = colFam(c);
  return f ? TRAITS.filter(t => famOf(t) === f) : [];
}
function srcFor(c, r){
  let sc = null;
  const g = COLG[c];
  if (g) sc = g.cols.find(isSrcCol);
  else { // 基本區（A-I）沒有分類物件，往右找同區的資料來源欄
    for (let i = c + 1; i < BASIC_COLS; i++) if (isSrcCol(i)){ sc = i; break; }
  }
  if (sc == null) return "";
  const v = (r[sc] || "").trim();
  return /^(?:[-–—─]+|n\/?a|na|無|none|nil)$/i.test(v) ? "" : v;
}
// 這份試算表裡真的存在欄位的特性才啟用；沒有欄位的（例如表中沒有敗血症分類）整個隱藏，
// 避免產生「此藥表中無對應族群資料」的雜訊。之後在試算表新增欄位就會自動出現。
let TRAIT_AVAIL = {};
function computeAvail(){
  TRAIT_AVAIL = {};
  TRAITS.forEach(t => {
    const f = famOf(t);
    let has = false;
    for (let c = 0; c < HEAD.length; c++) if (colFam(c) === f){ has = true; break; }
    TRAIT_AVAIL[t.key] = has;
  });
  document.querySelectorAll("[data-trait]").forEach(el => {
    el.style.display = TRAIT_AVAIL[el.dataset.trait] === false ? "none" : "";
  });
}
const availOK = t => TRAIT_AVAIL[t.key] !== false;
/* ---------- 給藥途徑 ---------- */
// 常見寫法對應到統一代號；未列出的照原樣顯示
const ROUTE_ALIAS = {INH:"INHL", INHAL:"INHL", INHALATION:"INHL", NEB:"INHL", 吸入:"INHL",
                     ORAL:"PO", 口服:"PO", 靜脈:"IV", IVPB:"IV", IVD:"IV", 肌肉:"IM",
                     TOP:"TOP", 外用:"TOP", IT:"IT", 鞘內:"IT"};
const ROUTE_ORDER = ["IV", "PO", "IM", "INHL", "IT", "TOP"];
function routesOf(r){
  return String(r[2] || "").split(/[\/,、+&;；]|\s+or\s+/i)
    .map(x => x.trim().toUpperCase()).filter(Boolean)
    .map(x => ROUTE_ALIAS[x] || x);
}
function buildRoutes(){
  const set = new Set();
  ROWS.forEach(r => routesOf(r).forEach(x => set.add(x)));
  ROUTES = [...set].sort((a, b) => {
    const ia = ROUTE_ORDER.indexOf(a), ib = ROUTE_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  ROUTE_SEL = ROUTE_SEL.filter(x => set.has(x));
}
function renderRoutes(){
  const box = document.getElementById("routes");
  if (!box) return;
  if (ROUTES.length < 2){ box.innerHTML = ""; return; }
  box.innerHTML = `<span class="rlabel">給藥途徑</span>` +
    ROUTES.map(x => `<button class="rchip${ROUTE_SEL.includes(x) ? " on" : ""}" data-route="${esc(x)}">${esc(x)}</button>`).join("") +
    (ROUTE_SEL.length ? `<button class="rclear" id="rclear">清除</button>` : "");
  box.querySelectorAll(".rchip").forEach(b => b.onclick = () => {
    const v = b.dataset.route;
    ROUTE_SEL = ROUTE_SEL.includes(v) ? ROUTE_SEL.filter(x => x !== v) : ROUTE_SEL.concat(v);
    renderRoutes(); render();
  });
  const c = document.getElementById("rclear");
  if (c) c.onclick = () => { ROUTE_SEL = []; renderRoutes(); render(); };
}

function activeTraits(){ const p = calc(); return TRAITS.filter(t => availOK(t) && t.active(p)); }
function ptReady(){ return activeTraits().length > 0; }

/* =========================================================
   條件解析引擎（多變數：CrCl / BMI / 體重 / 年齡）
   ========================================================= */
const KW  = "(?:crcl|cr\\s*cl|clcr|ccr|egfr|gfr|腎功能|腎絲球|廓清率|肌酸酐廓清(?:率)?)";
const UNI = "(?:m\\s*l|c\\.?\\s*c\\.?)\\s*\\/\\s*min";
const KW_CRCL = "(?:crcl|cr\\s*cl|clcr|ccr|肌酸酐廓清(?:率)?|廓清率|腎功能)";
const KW_EGFR = "(?:e?gfr|腎絲球(?:過濾)?(?:率)?)";
const VARS = [
  {key:"crcl", kw:KW_CRCL,                              unit:UNI},
  {key:"egfr", kw:KW_EGFR,                              unit:UNI},
  {key:"bmi",  kw:"(?:bmi|身體質量指數)",                 unit:"(?:kg\\s*\\/\\s*m\\s*[²2])"},
  {key:"wt",   kw:"(?:體重|tbw|abw|actual\\s*body\\s*weight|body\\s*weight|weight)", unit:"(?:kg|公斤)"},
  {key:"age",  kw:"(?:年齡|age)",                        unit:"(?:歲|y(?:ea)?rs?\\.?(?:\\s*old)?|y\\s*\\/\\s*o|yo)\\b"}
];
const HINT = new RegExp(KW_CRCL + "|" + KW_EGFR + "|" + UNI +
  "|bmi|體重|公斤|kg|年齡|age\\b|歲|y(?:ea)?rs?\\b|y\\s*\\/\\s*o|yo\\b|mon(?:th)?s?\\b|weeks?\\b|days?\\b|腎|透析|洗腎|renal|dialy", "i");

const DIALPAT = [
  {tag:"HD",   re:/(^|[^a-z])(?:hd|ihd)([^a-z]|$)|血液透析|血透|洗腎|hemodialy|haemodialy/i},
  {tag:"PD",   re:/(^|[^a-z])(?:pd|capd|apd|ccpd)([^a-z]|$)|腹膜透析|peritoneal/i},
  {tag:"CRRT", re:/crrt|cvvhdf|cvvhd|cvvh|scuf|持續性(?:腎臟)?替代/i},
  {tag:"SLED", re:/sled|\bedd\b|eddf|延長式|低效率/i},
  {tag:"ANY",  re:/esrd|末期腎(?:臟)?病|anuri|無尿|透析病人|dialysis patient/i}
];

const RE_AGE_RANGE = /(\d+(?:\.\d+)?)\s*(?:-|~|to|至)\s*([<≤>≥]?)\s*(\d+(?:\.\d+)?)\s*(mon(?:th)?s?|mo|weeks?|wks?|days?|個?月|週|天|日)\b/gi;
const RE_AGE_ONE   = /(\d+(?:\.\d+)?)\s*(mon(?:th)?s?|mo|weeks?|wks?|days?|個?月|週|天|日)\b/gi;
const yrs = (n, u) => {
  const d = /w|週/i.test(u) ? 52 : /d|天|日/i.test(u) ? 365 : 12;
  return (parseFloat(n) / d).toFixed(4);
};
function normNum(s){
  return (s || "").replace(/[–—−]/g, "-").replace(/≦/g, "≤").replace(/≧/g, "≥")
    .replace(/>=/g, "≥").replace(/<=/g, "≤")
    .replace(/大於等於|不小於|至少/g, "≥").replace(/小於等於|不大於|不超過/g, "≤")
    .replace(/大於|超過|高於/g, ">").replace(/小於|低於/g, "<")
    // 月／週／日齡一律換算成「歲」並保留單位標記，否則 "<3 months" 會變成沒有單位的 "<0.25"
    // 區間要兩個數字一起換算，否則 "≥3 to <6 months" 只換後面那個會壞掉
    .replace(RE_AGE_RANGE, (m, a1, op, b1, u) => yrs(a1, u) + " to " + op + yrs(b1, u) + " yr")
    .replace(RE_AGE_ONE,   (m, n, u) => yrs(n, u) + " yr");
}

function numConds(seg){
  const s = normNum(seg);
  if (!HINT.test(s)) return [];
  const out = [];
  const push = c => { if (!out.some(o => o.v === c.v && o.t === c.t && o.a === c.a && o.b === c.b)) out.push(c); };
  const N = "(\\d+(?:\\.\\d+)?)";
  const OP = "([<≤>≥]?)";
  VARS.forEach(V => {
    // (a) 先抽區間，允許兩端帶不等號：3 to <6、≥18 to <25
    let masked = s;
    const rangePats = [
      new RegExp(V.kw + "\\s*[:：]?\\s*" + OP + "\\s*" + N + "\\s*(?:-|~|至|to)\\s*" + OP + "\\s*" + N, "gi"),
      new RegExp(OP + "\\s*" + N + "\\s*(?:-|~|至|to)\\s*" + OP + "\\s*" + N + "\\s*" + V.unit, "gi")
    ];
    rangePats.forEach(re => {
      let m; re.lastIndex = 0;
      while ((m = re.exec(s))){
        push({v:V.key, t:"range", a:+m[2], b:+m[4], lx:m[1] === ">", ux:m[3] === "<"});
        masked = masked.slice(0, m.index) + " ".repeat(m[0].length) + masked.slice(m.index + m[0].length);
      }
    });
    // (b) 再抽單邊比較（區間已遮掉，不會重複計入）
    const cmpPats = [
      [new RegExp(V.kw + "\\s*[:：]?\\s*([<≤>≥])\\s*" + N, "gi"), m => push({v:V.key, t:m[1], a:+m[2]})],
      [new RegExp("([<≤>≥])\\s*" + N + "\\s*" + V.unit, "gi"),      m => push({v:V.key, t:m[1], a:+m[2]})],
      [new RegExp(V.kw + "\\s*[:：]?\\s*" + N + "(?:\\s*" + V.unit + ")?\\s*(以上|以下)", "gi"),
        m => push({v:V.key, t:m[2] === "以上" ? "≥" : "≤", a:+m[1]})]
    ];
    cmpPats.forEach(([re, fn]) => { let m; re.lastIndex = 0; while ((m = re.exec(masked))) fn(m); });
  });
  return out;
}

function dialTags(seg){
  const t = []; DIALPAT.forEach(d => { if (d.re.test(seg)) t.push(d.tag); }); return t;
}

function valOf(key, p){
  return key === "crcl" ? p.vCrCl : key === "egfr" ? p.vEgfr
       : key === "bmi" ? p.bmi : key === "wt" ? p.wt : key === "age" ? p.age : null;
}
function hold(c, v){
  return c.t === "range" ? ((c.lx ? v > c.a : v >= c.a) && (c.ux ? v < c.b : v <= c.b)) :
         c.t === "<" ? v <  c.a : c.t === "≤" ? v <= c.a :
         c.t === ">" ? v >  c.a : c.t === "≥" ? v >= c.a : false;
}

/* 判定片段。多變數採「變數之間 AND、同變數之內 OR」。
   病人缺少該變數數值時，該變數不判定，列入 unknown。 */
function matchSeg(seg){
  const p = calc();
  const dt = dialTags(seg), nc = numConds(seg);
  const parsed = dt.length > 0 || nc.length > 0;
  if (!parsed) return {match:false, parsed:false, unknown:[]};

  if (p.dial !== "none"){
    if (dt.includes(p.dial) || dt.includes("ANY")) return {match:true, parsed:true, unknown:[]};
    if (dt.length) return {match:false, parsed:true, unknown:[]};
    // 透析病人不採用 CrCl 數值條件，但非腎功能變數（BMI/體重/年齡）仍可判定
    const others = nc.filter(c => c.v !== "crcl" && c.v !== "egfr");
    if (!others.length) return {match:false, parsed:true, unknown:[]};
    return evalConds(others, p);
  }
  if (dt.length && !nc.length) return {match:false, parsed:true, unknown:[]};
  return evalConds(nc, p);
}
function evalConds(nc, p){
  const byVar = {};
  nc.forEach(c => { (byVar[c.v] = byVar[c.v] || []).push(c); });
  const unknown = [];
  let ok = true, any = false;
  Object.keys(byVar).forEach(k => {
    const v = valOf(k, p);
    if (v == null){ unknown.push(k); return; }
    any = true;
    // 同一段裡同一個變數的多個條件是交集（例："≥3 months and <2 years"），不是聯集
    if (!byVar[k].every(c => hold(c, v))) ok = false;
  });
  return {match: any && ok, parsed:true, unknown};
}

function splitSegs(text){
  const lines = String(text || "").split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const hasCond = t => numConds(t).length > 0 || dialTags(t).length > 0;
  // 尾端懸空的連接詞代表下一行是同一句的延續
  const DANGLE = /(?:\bor\b|\band\b|\bplus\b|[,，、;；+＋/／:：]|或|及|與|且)\s*$/i;

  // (a) 先把「同一句被換行拆開」的行合併回去：
  //     只有當這一行自己帶條件、且前面那段也已經有條件、且前段沒有懸空連接詞，才開新段
  const merged = [], cur = [];
  const flush = () => { if (cur.length){ merged.push(cur.join("\n")); cur.length = 0; } };
  // 只有冒號結尾、本身不含劑量的「標題行」會另起一段
  const isHeader = t => /[:：]\s*$/.test(t) && !RE_DOSE.test(t);
  lines.forEach(ln => {
    const last = cur.length ? cur[cur.length - 1] : "";
    if (cur.length){
      if (isHeader(ln)) flush();                    // 新標題 → 新的一段
      else if (DANGLE.test(last)) { }               // 前一行懸空 → 續行
      else if (hasCond(ln)) flush();                // 這一行自成條件 → 新的一段
    }
    cur.push(ln);
  });
  flush();

  // (b) 再處理「同一行寫了多個條件」的情形
  const out = [];
  const kwRe = new RegExp(KW_CRCL + "|" + KW_EGFR + "|bmi|體重", "gi");
  merged.forEach(p2 => {
    const idx = []; let m; kwRe.lastIndex = 0;
    while ((m = kwRe.exec(p2))) idx.push(m.index);
    if (idx.length < 2){ out.push(p2); return; }
    const pieces = [];
    for (let i = 0; i < idx.length; i++){
      const start = i === 0 ? 0 : idx[i];
      const end = i + 1 < idx.length ? idx[i + 1] : p2.length;
      const piece = p2.slice(start, end).trim();
      if (piece) pieces.push(piece);
    }
    const good = pieces.filter(x => hasCond(x)).length;
    if (good >= 2) pieces.forEach(x => out.push(x)); else out.push(p2);
  });
  return out;
}

/* ---------- 片段語意分類 ---------- */
const RE_NOCHANGE = /[不無毋勿](?:須|需|必|用)(?:要)?(?:再|另)?(?:做)?調整|[不無]需[要]?調整|維持(?:原|常規|一般|標準)?劑量|同(?:一般|常規|正常|標準)|依常規|按一般劑量|no\s+(?:dose\s+)?adjust|no\s+change|not\s+(?:required|necessary|needed)|unchanged|as\s+(?:per\s+)?normal|standard\s+dos/i;
const RE_DOSE = /\d+(?:\.\d+)?\s*(?:mg|g|gm|mcg|µg|ug|iu|units?|u)\b|q\s*\d+\s*h|q\d+h|\b(?:bid|tid|qid|qd|qod|q\.?d\.?)\b|每\s*\d+\s*(?:小時|天|日)|mg\s*\/\s*kg/i;
function classify(text){
  if (RE_NOCHANGE.test(text)) return "none";
  if (RE_DOSE.test(text)) return "dose";
  return "info";
}
// 去掉條件前綴，只留劑量本文
function doseOf(seg){
  const i = seg.search(/[：:]/);
  if (i > -1 && i < seg.length - 1){
    const left = seg.slice(0, i), right = seg.slice(i + 1).trim();
    if (right && (numConds(left).length || dialTags(left).length ||
        new RegExp(KW + "|bmi|體重|年齡", "i").test(left))) return right.replace(/[；;，,、]\s*$/, "");
  }
  return seg.replace(/[；;]\s*$/, "");
}

/* =========================================================
   逐藥品彙整
   ========================================================= */
// 「-」「—」「N/A」「無」等佔位符視同空白
const EMPTY_RE = /^(?:[-–—─]+|n\/?a|na|no\s*data|無|無資料|無相關資料|none|nil|不適用|未提及|\?+)$/i;
const cell = v => { v = (v || "").trim(); return EMPTY_RE.test(v) ? "" : v; };

function findingsFor(r, t){
  const out = [];
  traitCols(t).forEach(c => {
    const val = cell(r[c]); if (!val) return;
    const segs = splitSegs(val).map(s => ({s, m: matchSeg(s)}));
    const anyParsed = segs.some(x => x.m.parsed);
    // 命中條件的片段，加上「本身沒有任何條件」的片段——後者是無條件適用的敘述
    // （例如 Zinforo 的 "Bloodstream infection: 15 mg/kg/dose"、Amsulber 的 "Standard dose: ..."），
    // 不能因為同一格別處有條件就把它們丟掉
    segs.forEach(x => { x.uncond = !x.m.parsed; });
    let hits = segs.filter(x => x.m.match || x.uncond).map(x => x.s);
    let whole = false;
    // 非條件式族群欄（例：標題就叫「肥胖劑量」）且內文沒有可判讀條件 → 整欄視為適用
    if (!hits.length && !anyParsed && t.kind === "plain"){ hits = [val]; whole = true; }
    out.push({col:c, head:HEAD[c], group:(COLG[c] && COLG[c].title) || "", val, segs,
              hits, anyParsed, whole, src:srcFor(c, r)});
  });
  return out;
}
// 一般成人劑量欄（速效 / 維持 / 頻率…），即未被任何族群認領的劑量欄
function baseDoseCols(r){
  const out = [];
  for (let c = 0; c < HEAD.length; c++){
    if (!HEAD[c] || isSrcCol(c)) continue;
    if (colTraits(c).length) continue;
    if (!/劑量|用法|用量|給藥|dose|dosing|regimen|頻率|頻次|輸注|infusion/i.test(HEAD[c])) continue;
    const v = cell(r[c]); if (!v) continue;
    out.push({col:c, head:HEAD[c], val:v, src:srcFor(c, r)});
  }
  return out;
}

/* 把「速效劑量 / 維持劑量 / 頻率」這類分散在不同欄位的片段，
   組成一段完整、不會自相矛盾的給藥指示。 */
const RE_LOAD = /速效|負荷|loading/i;
const RE_FREQ = /頻率|頻次|間隔|interval|frequency/i;
const RE_NOTE = /備註|注意|note|comment|影響/i;
const RE_MAIN = /腎功能|調整|renal|crcl|egfr|建議劑量/i;

/* 把散在不同欄位的片段整理成表格列 [{k 項目, v 內容, src 來源}]，
   固定順序：負荷劑量 → 維持劑量 → 頻率 → 備註 */
function doseRows(parts){
  const lab = h => RE_LOAD.test(h) ? "負荷劑量"
                 : RE_FREQ.test(h) ? "頻率"
                 : RE_NOTE.test(h) ? "備註"
                 : RE_MAIN.test(h) ? "建議劑量"
                 : (h || "建議劑量");
  const ord = k => k === "負荷劑量" ? 0 : k === "頻率" ? 2 : k === "備註" ? 3 : 1;
  const rows = parts.filter(x => x.val)
    .map(x => ({k:lab(x.head), v:String(x.val).replace(/[ \t]*\n[ \t]*/g, "\n").replace(/\n{2,}/g, "\n").trim(), src:x.src || ""}))
    .filter(x => x.v)
    .sort((x, y) => ord(x.k) - ord(y.k));
  // 備註不另起一列，併入劑量建議的括號內：劑量建議（備註資訊）
  const notes = rows.filter(x => x.k === "備註");
  const main = rows.filter(x => x.k !== "備註");
  if (!notes.length || !main.length) return rows;
  const host = main.find(x => x.k === "建議劑量" || x.k === "維持劑量") || main[main.length - 1];
  const txt = notes.map(x => x.v).join("；");
  host.v = host.v + "（" + txt + "）";
  return main;
}
// 表格列壓成一行純文字（供分類判斷與警告句使用）
const rowsText = rows => rows.filter(x => x.k !== "備註").map(x => x.v).join("　");
const rowsLine = rows => rows.map(x => (x.k === "建議劑量" ? "" : x.k + " ") + x.v).join("\n");

/* 解析單一特性，回傳該族群對這位病人的結論。
   同一族群可能把資訊拆在多欄（速效劑量／維持劑量／頻率），一律合併成一段完整指示；
   其中「有條件的欄位」取比中的條文，「無條件的欄位」取整欄內容。
   kind: "dose" 有具體劑量 / "none" 明示不需調整 / "info" 僅注意事項 / null 無資料 */
function resolveTrait(r, t){
  const fs = findingsFor(r, t);
  if (!fs.length) return {kind:null, fs, hasCol:false};
  const parts = [], segs = [], missedCols = [];
  fs.forEach(f => {
    let val;
    if (f.anyParsed){
      if (!f.hits.length){ missedCols.push(f); return; }
      val = f.hits.map(doseOf).join("\n");
      // 頻率／速效這類欄位的條文要冠上欄名才看得懂；腎功能欄的條文本身已含條件，不重複
      const pre = RE_MAIN.test(f.head) ? "" : f.head + "：";
      f.hits.forEach(h => segs.push({seg:pre + h, src:f.src, head:f.head}));
    } else {
      val = f.val;
      segs.push({seg:f.head + "：" + f.val, src:f.src, head:f.head});
    }
    if (val) parts.push({head:f.head, val, src:f.src, cond:f.anyParsed});
  });
  if (!parts.length) return {kind:null, fs, hasCol:true, missed:missedCols.length > 0};
  const rows = doseRows(parts);
  const text = rowsText(rows);
  const kind = !text ? "info"
    : (RE_NOCHANGE.test(text) && !RE_DOSE.test(text)) ? "none"
    : RE_DOSE.test(text) ? "dose" : "info";
  return {kind, rows, text, line:rowsLine(rows), segs, parts, fs, hasCol:true, missedCols,
          composed: parts.length > 1 || !parts[0].cond};
}

function synth(r){
  const p = calc();
  const acts = activeTraits();
  const res = {details:[], modifiers:[], conflicts:[], missing:[],
               base:null, baseTrait:null, baseVia:"", general:null, superseded:false};

  const resolved = new Map();
  acts.forEach(t => {
    const rv = resolveTrait(r, t);
    resolved.set(t, rv);
    res.details.push({trait:t, fs:rv.fs});
  });

  // 一般成人劑量
  const bd = baseDoseCols(r);
  const grows = doseRows(bd);
  if (grows.length) res.general = {rows:grows, text:rowsText(grows), line:rowsLine(grows), parts:bd};

  // 基礎劑量：兒科 > 透析 > 腎功能
  const baseCands = acts.filter(t => t.base).sort((a, b) => (a.basePri || 9) - (b.basePri || 9));
  let baseT = null, baseR = null;
  for (const t of baseCands){
    const rv = resolved.get(t);
    if (rv.kind === "dose" || rv.kind === "none"){ baseT = t; baseR = rv; break; }
    if (!baseT && rv.kind === "info"){ baseT = t; baseR = rv; }
  }

  if (baseT && baseR.kind === "dose"){
    res.base = {rows:baseR.rows, text:baseR.text, segs:baseR.segs};
    res.baseTrait = baseT;
    res.baseVia = baseT.label + " " + baseT.note(p) + " → " + (baseR.composed ? "該族群專屬欄位" : baseR.segs.map(x => x.head).join("、"));
    res.superseded = !!res.general;   // 一般劑量已被取代
  } else if (baseT && baseR.kind === "none" && res.general){
    res.base = {rows:res.general.rows, text:res.general.text, segs:baseR.segs, fromGeneral:true};
    res.baseTrait = baseT;
    res.baseVia = baseT.label + " " + baseT.note(p) + " 註明不需調整 → 採一般成人劑量";
  } else if (res.general){
    res.base = {rows:res.general.rows, text:res.general.text, segs:[], fromGeneral:true};
    res.baseVia = baseT ? (baseT.label + " 未比中可用條文 → 暫採一般成人劑量，請自行確認")
                        : "一般成人劑量（無適用的族群條件）";
    res.baseNeedsCheck = !!baseT;
  }

  // 修飾特性
  acts.forEach(t => {
    if (t === res.baseTrait) return;
    const rv = resolved.get(t);
    if (rv.kind == null){ res.missing.push({trait:t, hasCol:!!rv.hasCol}); return; }
    const row = {trait:t, kind:rv.kind, text:rv.text, line:rv.line, rows:rv.rows, segs:rv.segs};
    res.modifiers.push(row);
    if (rv.kind === "dose") res.conflicts.push(row);
  });
  return res;
}

/* ---------- 工具 ---------- */
const norm = s => (s || "").toLowerCase().replace(/\s+/g, "");
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text, terms){
  let out = esc(text);
  terms.forEach(t => { if(!t) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    out = out.replace(re, m => "<mark>" + m + "</mark>"); });
  return out;
}
function filtered(terms){
  const keys = terms.map(norm);
  return ROWS.filter(r => {
    if (ROUTE_SEL.length && !routesOf(r).some(x => ROUTE_SEL.includes(x))) return false;
    if (!keys.length) return true;
    const hay = norm(r[0]) + "|" + norm(r[1]);
    return keys.every(k => hay.includes(k));
  });
}
function segCell(text){
  const segs = splitSegs(text);
  return segs.map(s => {
    const m = matchSeg(s);
    if (m.match) return `<div class="seg hit"><span class="tick">✓</span>${esc(s)}</div>`;
    return `<div class="seg${m.parsed ? " dim" : ""}">${esc(s)}</div>`;
  }).join("");
}

/* ---------- 病人面板 ---------- */
function ptRender(){
  const c = calc(), box = document.getElementById("ptcalc"), warn = document.getElementById("ptwarn");
  const isPeds = c.age != null && c.age < 18;
  const v2 = n => (Math.round(n * 100) / 100).toFixed(2);
  // 一列＝一組同類數值，並排比較；框線標示「實際採用」的那一個
  const chip = (label, val, unit, on) =>
    `<span class="cgv${on ? " on" : ""}">${esc(label)} <b>${esc(val)}</b>${unit ? `<i>${esc(unit)}</i>` : ""}</span>`;
  const rows = [];

  const wts = [];
  if (c.wt) wts.push(chip("TBW", r1(c.wt), "kg", c.cwtag === "TBW"));
  if (c.ibw) wts.push(chip("IBW", r1(c.ibw), "kg", c.cwtag === "IBW"));
  if (c.adj) wts.push(chip("AdjBW", r1(c.adj), "kg", c.cwtag === "AdjBW"));
  if (c.bmi) wts.push(chip("BMI", r1(c.bmi), "", false));
  if (c.bsa) wts.push(chip("BSA", v2(c.bsa), "m²", false));
  if (wts.length) rows.push({k:"體重", v:wts, tip:"IBW（Devine）：男 50／女 45.5 + 2.3 ×（身高 inch − 60）\n　限身高 ≥152 cm，兒童不適用\nAdjBW＝IBW + 0.4 ×（TBW − IBW），TBW ≤ IBW 時＝TBW\nBMI＝體重 kg ÷ 身高 m²\nBSA（Du Bois）＝0.007184 × 身高^0.725 × 體重^0.425"});

  const crs = [];
  if (c.cgTBW != null) crs.push(chip("CG·TBW", r1(c.cgTBW), "", c.crclSrc === "CG/TBW"));
  if (c.cgIBW != null) crs.push(chip("CG·IBW", r1(c.cgIBW), "", c.crclSrc === "CG/IBW"));
  if (c.cgAdj != null && c.adj !== c.wt) crs.push(chip("CG·AdjBW", r1(c.cgAdj), "", c.crclSrc === "CG/AdjBW"));
  if (num(PT.crclman) != null) crs.push(chip("手動指定", r1(c.vCrCl), "", true));
  if (isPeds && c.schw != null && !crs.length) crs.push(chip("Schwartz 代用", r1(c.schw), "", true));
  if (crs.length) rows.push({k:"CrCl", v:crs, u:"mL/min", tip:"Cockcroft-Gault：(140 − 年齡) × 體重 ÷ (72 × SCr)，女性 × 0.85\n　體重依「CrCl 採用體重」設定（TBW／IBW／AdjBW）\n　限 ≥18 歲；兒童改以 Schwartz eGFR 代用\n已填「直接指定 CrCl」時以指定值為準"});

  const eg = [];
  if (c.mdrd != null && !isPeds) eg.push(chip("MDRD (IDMS)", r1(c.mdrd), "", c.egfrFormula === "mdrd"));
  if (c.epi != null && !isPeds) eg.push(chip("CKD-EPI 2021", r1(c.epi), "", c.egfrFormula === "epi"));
  if (c.schw != null && isPeds) eg.push(chip("Schwartz", r1(c.schw), "", true));
  if (c.egfrAbs != null) eg.push(chip("絕對值 (×BSA/1.73)", r1(c.egfrAbs), "mL/min", false));
  if (eg.length) rows.push({k:"eGFR", v:eg, u:"mL/min/1.73m²", tip:"MDRD（IDMS，採用）：175 × SCr^−1.154 × 年齡^−0.203，女性 × 0.742\nCKD-EPI 2021（對照）：142 × min(SCr/κ,1)^α × max(SCr/κ,1)^−1.200 × 0.9938^年齡，女性 × 1.012\n　κ 男 0.9／女 0.7；α 男 −0.302／女 −0.241\n兒童 Schwartz：0.413 × 身高 cm ÷ SCr\n皆未套用種族係數\n絕對值＝eGFR × BSA ÷ 1.73"});

  const tr = activeTraits().filter(t => t.key !== "renal")
    .map(t => `<span class="cgv trait">${esc(t.label)}<i>${esc(t.note(c))}</i></span>`);
  if (tr.length) rows.push({k:"符合特性", v:tr, tip:"肥胖：成人 BMI ≥30 或 TBW > 1.2 × IBW\n低體重：成人 BMI <18.5\n高齡：≥75 歲\n兒科：<18 歲"});

  box.innerHTML = rows.map(r => `<div class="cgrow"><span class="cgk">${esc(r.k)}${r.tip ? `<span class="tipi" data-tip="${esc(r.tip)}">i</span>` : ""}${r.u ? `<i>${esc(r.u)}</i>` : ""}</span>
      <span class="cgvs">${r.v.join("")}</span></div>`).join("");

  let w = "";
  const man = num(PT.crclman);
  if (man != null) w = `已直接指定 CrCl ${man} mL/min（非肌酸酐值），公式估算值不採用。`;
  else if (c.crclProxy) w = "兒童無 CG 公式，表中寫 CrCl 的條文改以 Schwartz eGFR 代用判定，兩者非完全等值。";
  else if (c.egfrProxy) w = "無法計算 eGFR，表中寫 eGFR 的條文改以 CrCl 代用判定。";
  else if (c.vCrCl != null && c.vEgfr != null && Math.abs(c.vCrCl - c.vEgfr) / Math.max(c.vCrCl, c.vEgfr) > 0.25)
    w = `CrCl ${r1(c.vCrCl)} 與 eGFR ${r1(c.vEgfr)} 差距逾 25%（一為絕對值、一為每 1.73m² 標準化），請注意該藥文獻是以哪一個分層。`;
  else if (c.wselFallback) w = `無法計算${({ibw:"理想體重 IBW", adj:"調整體重 AdjBW"})[c.wselFallback] || ""}（需要身高，且 Devine 公式限身高 ≥152 cm），CG 已改用實際體重 TBW。`;
  else if (isPeds && c.schw == null) w = "兒童需要身高與 SCr 才能以 Schwartz 估算腎功能。";
  else if (c.ibwNA) w = "身高 <152 cm，Devine 理想體重公式不適用，CG 改以實際體重計算。";
  else if (c.dial !== "none" && c.crcl != null) w = "已選擇腎臟替代治療，比對時以透析條件優先，不採用 CrCl 數值條件。";
  else if (c.crcl == null && c.dial === "none") w = "需要年齡、性別、體重、血清肌酸酐 SCr（或直接填入已知的 CrCl）才能比對腎功能條件。";
  else if (c.age && c.age >= 65 && c.scr && c.scr < 0.8) w = "高齡且 SCr 偏低，CG 公式可能高估腎功能。";
  warn.textContent = w;


  const s = [];
  if (c.age) s.push(ageTxt(c.age));
  s.push(PT.sex === "F" ? "女" : "男");
  if (c.ht) s.push(c.ht + "cm");
  if (c.wt) s.push(c.wt + "kg");
  const sum = document.getElementById("ptsum");
  const acts = activeTraits();
  if (!c.age && !c.ht && !c.wt && !c.scr && !acts.length){
    sum.innerHTML = "尚未輸入 — 點此展開填寫，可自動比對劑量條件";
  }else{
    let tail = "";
    if (c.vCrCl != null) tail += ` ・ <b>CrCl ${r1(c.vCrCl)}</b>`;
    if (c.vEgfr != null) tail += ` ・ <b>eGFR ${r1(c.vEgfr)}</b>`;
    const others = acts.filter(t => t.key !== "renal").map(t => t.label);
    if (others.length) tail += ` ・ <b>${esc(others.join("／"))}</b>`;
    sum.innerHTML = esc(s.join(" ")) + tail;
  }
}
function ptBind(){
  Object.keys(PIDS).forEach(k => {
    const el = document.getElementById(PIDS[k]); if (!el) return;
    const fn = () => { PT[k] = el.value; ptSave(); ptRender(); renderTabs(); render(); syncBuiltin(); };
    el.addEventListener("input", fn); el.addEventListener("change", fn);
  });
  document.getElementById("pthead").onclick = () => document.getElementById("pt").classList.toggle("open");
  document.getElementById("p_clear").onclick = () => {
    Object.keys(PT).forEach(k => PT[k] = (DEF[k] != null ? DEF[k] : ""));
    Object.keys(PIDS).forEach(k => { const el = document.getElementById(PIDS[k]); if (el) el.value = PT[k]; });
    ptSave(); ptRender(); renderTabs(); render();
  };
}

/* ---------- 分類列 ---------- */
let SUBOPEN = false;   // 特殊族群子分類是否展開
function renderTabs(){
  const inGroup = MODE > 0, open = SUBOPEN || inGroup;
  const cur = inGroup ? GROUPS[MODE - 1] : null;
  const main = [
    {id:"base", n:"基本資料 (成人)", on:MODE === 0},
    {id:"grp",  n:"特殊族群" + (cur ? "：" + cur.title : "") + (open ? " ▴" : " ▾"), on:inGroup},
    {id:"pt",   n:"⚕️ 個人化建議", on:MODE === -1}
  ];
  let html = main.map(x => `<button class="tab${x.on ? " on" : ""}" data-t="${x.id}">${esc(x.n)}</button>`).join("");
  if (open && GROUPS.length)
    html += `<div class="subtabs">` + GROUPS.map((g, i) =>
      `<button class="stab${MODE === i + 1 ? " on" : ""}" data-m="${i + 1}">${esc(g.title)}</button>`).join("") + `</div>`;
  const box = document.getElementById("tabs");
  box.innerHTML = html;
  const go = () => { renderTabs(); render(); window.scrollTo({top:0, behavior:"smooth"}); };
  box.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    if (t === "base"){ MODE = 0; SUBOPEN = false; }
    else if (t === "pt"){ MODE = -1; SUBOPEN = false; }
    else { SUBOPEN = !open; if (!SUBOPEN && inGroup) MODE = 0; renderTabs(); return; }
    go();
  });
  box.querySelectorAll(".stab").forEach(b => b.onclick = () => { MODE = +b.dataset.m; SUBOPEN = true; go(); });
}

/* ---------- 主畫面 ---------- */
function render(){
  const q = document.getElementById("search").value.trim();
  const terms = q ? q.split(/\s+/) : [];
  const rows = filtered(terms);
  const view = document.getElementById("view");
  const st = document.getElementById("status");

  if (!ROWS.length){ view.innerHTML = ""; return; }
  if (!rows.length){ view.innerHTML = '<div class="empty">查無符合的藥品</div>'; st.textContent = ""; return; }

  if (MODE === -1){ view.innerHTML = personal(rows, terms); }
  else if (MODE === 0){ view.innerHTML = cards(rows, terms); }
  else {
    const g = GROUPS[MODE - 1];
    const has = rows.filter(r => g.cols.some(c => (r[c] || "").trim()));
    const shown = has.length ? has : rows;
    view.innerHTML =
      `<p class="hint">「${esc(g.title)}」— 顯示所有藥品的該分類內容${has.length < rows.length ? `（已隱藏 ${rows.length - has.length} 筆無資料的藥品）` : ""}${ptReady() ? "・<b>綠色</b>＝符合目前病人條件" : ""}</p>` +
      table(shown, g, terms);
  }
  const rf = ROUTE_SEL.length ? `（途徑：${ROUTE_SEL.join("／")}）` : "";
  st.textContent = (q || ROUTE_SEL.length) ? `符合 ${rows.length} 筆${rf}` : "";
}

/* ---------- 個人化建議 ---------- */
function ptLine(){
  const c = calc(); const bits = [];
  if (c.age) bits.push(ageTxt(c.age));
  bits.push(PT.sex === "F" ? "女" : "男");
  if (c.wt) bits.push(c.wt + "kg");
  activeTraits().forEach(t => bits.push(t.label + " " + t.note(c)));
  return bits.join("・");
}

function srcCell(x){ return x ? `<span class="src">${esc(x)}</span>` : `<span class="src dash">—</span>`; }

// 主劑量表：項目 / 建議內容 / 來源
function doseTable(rows, cls){
  if (!rows || !rows.length) return "";
  if (cls === "main" && !rows.some(x => x.k === "負荷劑量"))
    rows = [{k:"負荷劑量", v:"—", src:"", none:true}].concat(rows);
  return `<table class="ctab ${cls || ""}"><thead><tr>
      <th style="width:88px">項目</th><th>建議內容</th><th class="srccol" style="width:120px">建議欄位來源</th></tr></thead><tbody>` +
    rows.map(x => `<tr${x.none ? ' class="dimrow"' : ""}><td class="kk">${esc(x.k)}</td>
      <td class="vv">${esc(x.v)}<div class="srcinline">來源：${esc(x.src || "—")}</div></td>
      <td class="srccol">${srcCell(x.src)}</td></tr>`).join("") + `</tbody></table>`;
}

function conclusion(r, s){
  const p = calc(), acts = activeTraits();
  if (!s.base && !s.modifiers.length){
    const hepT0 = TRAITS.find(t => t.key === "hep");
    const hepTxt = hepT0 && availOK(hepT0) ? traitCols(hepT0).map(c => cell(r[c])).filter(Boolean).join("\n") : "";
    return `<div class="concl non">${hepTxt ? `<div class="ck">肝功能（共通資訊）</div><div class="cbase" style="white-space:pre-line;color:var(--text)">${esc(hepTxt)}</div><div class="ck2"></div>` : ""}<div class="ck">綜合結論</div>
      <div class="cdose">此藥在表中沒有可對應目前病人條件的劑量資料</div>
      <div class="cbase">請改用下方分頁的總表自行判讀。</div></div>`;
  }
  const amb = s.conflicts.length > 0 || !s.base || s.baseNeedsCheck;
  const main = s.base
    ? doseTable(s.base.rows, "main") + `<div class="cbase">依據：${esc(s.baseVia)}</div>`
    : `<div class="cdose">無法判定基礎劑量</div><div class="cbase">未比中族群條件，且表中無可用的一般劑量欄。</div>`;

  // 判讀依據表：特性 / 判定 / 原文 / 來源
  const why = [];
  if (s.base){
    const lbl = s.baseTrait ? s.baseTrait.label : "一般劑量";
    // 同一個族群（例如 HD、ECMO）的劑量與頻次合併成一列，不再逐欄拆開
    const bsegs = s.base.segs || [];
    if (bsegs.length){
      const srcs = [...new Set(bsegs.map(x => x.src).filter(Boolean))];
      why.push({t:lbl, k:"採用", v:bsegs.map(x => x.seg).join("\n"), src:srcs.join("／")});
    }
    if (s.base.fromGeneral && s.general)
      why.push({t:"一般劑量", k:"採用", v:s.general.line, src:(s.general.rows.find(z => z.src) || {}).src || ""});
  }
  s.modifiers.forEach(m => {
    const verb = m.kind === "none" ? "不需調整" : m.kind === "dose" ? "另有劑量" : "注意事項";
    const msrcs = [...new Set((m.segs || []).map(x => x.src).filter(Boolean))];
    why.push({t:m.trait.label, k:verb, v:m.line || m.text, src:msrcs.join("／"), cls:m.kind});
  });
  const hepT = TRAITS.find(t => t.key === "hep");
  if (hepT && availOK(hepT)) traitCols(hepT).forEach(c => {
    const v = cell(r[c]); if (!v) return;
    why.push({t:"肝功能", k:"共通資訊", v:(HEAD[c] && !/肝功能/.test(HEAD[c]) ? HEAD[c] + "：" : "") + v, src:srcFor(c, r)});
  });
  const whyTable = why.length ? `<div class="ck2">判讀依據</div>
    <table class="ctab why"><thead><tr><th style="width:96px">特性</th><th style="width:74px">判定</th>
      <th>依據原文</th><th class="srccol" style="width:120px">建議欄位來源</th></tr></thead><tbody>` +
    why.map(x => `<tr class="${x.cls === "none" ? "dimrow" : ""}"><td class="kk">${esc(x.t)}</td>
      <td class="jj ${x.cls || ""}">${esc(x.k)}</td>
      <td class="vv">${esc(x.v)}<div class="srcinline">來源：${esc(x.src || "—")}</div></td>
      <td class="srccol">${srcCell(x.src)}</td></tr>`).join("") + `</tbody></table>` : "";

  const notes = [];
  if (s.conflicts.length)
    notes.push(`<div class="cwarn">⚠ ${esc(s.conflicts.map(c => c.trait.label).join("、"))} 另有具體劑量建議，與上方劑量不是可直接相加的獨立調整，須人工整合後決定。</div>`);
  if (s.baseNeedsCheck)
    notes.push(`<div class="cwarn">⚠ 目前符合的族群條件在表中未比中可用條文，上方顯示的是一般成人劑量，未經該族群校正。</div>`);
  if (!s.conflicts.length && !s.baseNeedsCheck){
    const nones = s.modifiers.filter(m => m.kind === "none").map(m => m.trait.label);
    if (nones.length) notes.push(`<div class="cmiss">${esc(nones.join("、"))} 皆註明不需調整 → <b>維持上方劑量</b>。</div>`);
  }
  const miss = s.missing.filter(m => m.hasCol), nocol = s.missing.filter(m => !m.hasCol);
  if (miss.length || nocol.length){
    const a1 = miss.length ? `${miss.map(m => m.trait.label).join("、")}：表中有欄位但未比中條件，請看下方原文。` : "";
    const b1 = nocol.length ? `${nocol.map(m => m.trait.label).join("、")}：此藥表中無對應族群資料。` : "";
    notes.push(`<div class="cmiss">${esc(a1)}${a1 && b1 ? " " : ""}${esc(b1)}</div>`);
  }
  return `<div class="concl${amb ? " amb" : ""}"><div class="ck">綜合結論（符合 ${acts.length} 項特性）</div>
    ${main}${whyTable}${notes.join("")}</div>`;
}

function detailBlock(r, s){
  const secs = [];
  s.details.forEach(d => {
    d.fs.forEach(f => {
      const body = f.whole
        ? `<div class="seg hit"><span class="tick">✓</span>${esc(f.val)}</div>`
        : f.segs.map(x => x.m.match
            ? `<div class="seg hit"><span class="tick">✓</span>${esc(x.s)}</div>`
            : x.uncond
              ? `<div class="seg hit uncond"><span class="tick">•</span>${esc(x.s)}</div>`
              : `<div class="seg dim">${esc(x.s)}</div>`).join("");
      secs.push(`<div class="dsec"><div class="dh"><span class="tag">${esc(d.trait.label)}</span>
        ${esc(f.head)}${f.group && f.group !== f.head ? ` <span class="gp">／${esc(f.group)}</span>` : ""}
        <span class="src">${f.src ? esc(f.src) : "—"}</span></div>
        <div class="db">${body}</div></div>`);
    });
  });
  baseDoseCols(r).forEach(b => {
    secs.push(`<div class="dsec${s.superseded ? " gone" : ""}"><div class="dh">
      <span class="tag">${s.superseded ? "已取代" : "一般"}</span>${esc(b.head)}
      <span class="src">${b.src ? esc(b.src) : "—"}</span></div>
      <div class="db"><div class="v">${esc(b.val)}</div></div></div>`);
  });
  if (!secs.length) return "";
  return `<details class="det"><summary>詳細資料與參考原文（${secs.length} 項）</summary>${secs.join("")}</details>`;
}

function personal(rows, terms){
  if (!ptReady()){
    return `<div class="empty"><b>尚未填寫病人資料，無法產生個人化建議。</b><br><br>
      請先在上方「病人資訊」填入 年齡／性別／體重／SCr（或直接指定 CrCl），<br>或選擇 透析、ECMO、重症 等特性。<br><br>
      <button class="primary" onclick="document.getElementById('pt').classList.add('open');window.scrollTo({top:0,behavior:'smooth'})">展開病人資訊</button></div>`;
  }
  const q = document.getElementById("search").value.trim();
  if (!q) return `<p class="hint">依 <b>${esc(ptLine())}</b> 比對。</p>
    <div class="empty">請在上方搜尋框輸入藥品名稱或成分，即會顯示該藥的個人化劑量建議。</div>`;
  const list = rows;
  const head = `<p class="hint">依 <b>${esc(ptLine())}</b> 比對；結論為各項特性條件的整合，<span style="color:var(--hit-line);font-weight:700">綠色 ✓</span> 為符合的原文片段。</p>`;

  return head + list.map(r => {
    const s = synth(r);
    return `<div class="drug"><div class="dhead">
      <div class="dn" style="font-size:16px">${hl(r[0], terms)}${r[2] ? `<span class="rt">${esc(r[2])}</span>` : ""}</div>
      <div class="di">${hl(r[1], terms)}</div>${extraBtns(r, "*")}</div>
      ${conclusion(r, s)}${detailBlock(r, s)}
      <div class="disc">自動比對僅根據表中文字的數值與族群條件，敘述式條件可能遺漏；多重特性的結論為條列整合，非藥動學運算。請務必核對原文與臨床情境後再決定劑量。</div>
      </div>`;
  }).join("");
}

function drugCell(r, terms){
  return `<td class="drugcell"><div class="dn">${hl(r[0], terms)}${r[2] ? `<span class="rt">${esc(r[2])}</span>` : ""}</div>
          <div class="di">${hl(r[1], terms)}</div>${extraBtns(r, "*")}</td>`;
}
function table(rows, g, terms){
  const th = g.cols.map(c => `<th>${esc(HEAD[c])}</th>`).join("");
  const on = ptReady();
  const body = rows.map(r => `<tr>${drugCell(r, terms)}` +
    g.cols.map(c => {
      const v = (r[c] || "").trim();
      const bt = extraBtns(r, HEAD[c] || "");
      if (!v && !bt) return `<td><span class="na">—</span></td>`;
      const act = on && colTraits(c).some(t => activeTraits().includes(t));
      const inner = !v ? "" : act ? segCell(v) : `<div class="v">${esc(v)}</div>`;
      return `<td>${inner}${bt}</td>`;
    }).join("") + "</tr>").join("");
  return `<div class="tblwrap"><table><thead><tr><th>藥品 / 成分</th>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function cards(rows, terms){
  const on = ptReady(), acts = activeTraits();
  return rows.map(r => {
    const fs = [];
    for (let c = 3; c < BASIC_COLS; c++){
      if (!HEAD[c]) continue;
      const val = (r[c] || "").trim();
      const bt = extraBtns(r, HEAD[c]);
      const act = on && colTraits(c).some(t => acts.includes(t));
      const inner = !val ? (bt ? "" : `<div class="v na">—</div>`) : act ? segCell(val) : `<div class="v">${esc(val)}</div>`;
      fs.push(`<div class="f"><div class="k">${esc(HEAD[c])}</div>${inner}${bt}</div>`);
    }
    return `<div class="drug"><div class="dhead">
      <div class="dn" style="font-size:16px">${hl(r[0], terms)}${r[2] ? `<span class="rt">${esc(r[2])}</span>` : ""}</div>
      <div class="di">${hl(r[1], terms)}</div>${extraBtns(r, "*")}</div>
      <div class="fields">${fs.join("")}</div></div>`;
  }).join("");
}

/* i 說明浮窗：滑過顯示，點一下固定 */
(function(){
  const tip = document.getElementById("tip"); let pinned = null;
  const show = el => { tip.textContent = el.dataset.tip; tip.style.display = "block";
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width/2 - w/2), innerWidth - w - 8), y = r.bottom + 8;
    if (y + h > innerHeight - 8) y = r.top - h - 8;
    tip.style.left = x + "px"; tip.style.top = y + "px"; };
  const hide = () => { tip.style.display = "none"; };
  document.addEventListener("mouseover", e => { const el = e.target.closest(".tipi"); if (el) show(el); });
  document.addEventListener("mouseout", e => { if (e.target.closest(".tipi") && !pinned) hide(); });
  document.addEventListener("click", e => {
    const el = e.target.closest(".tipi");
    if (el){ e.stopPropagation(); e.preventDefault(); }
    if (pinned) pinned.classList.remove("on");
    if (el && el !== pinned){ pinned = el; el.classList.add("on"); show(el); } else { pinned = null; hide(); }
  }, true);
  addEventListener("scroll", () => { if (pinned) show(pinned); else hide(); }, true);
})();
document.getElementById("load").onclick = () => load(true);
document.getElementById("search").oninput = render;

renderTools();
ptLoad(); ptBind(); ptRender();
MODE = 0;

try{
  const c = JSON.parse(localStorage.getItem("abx_cache") || "null");
  if (c && c.raw){
    parse(c.raw);
    document.getElementById("meta").textContent =
      `共 ${ROWS.length} 筆・快取於 ${new Date(c.ts).toLocaleString("zh-TW")}`;
    document.getElementById("status").textContent = "";
    renderTabs(); renderRoutes(); render();
  }
}catch(e){}
load();
