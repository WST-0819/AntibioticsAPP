<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抗生素劑量查詢系統</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e2e8f0; --text:#1a202c; --muted:#64748b;
    --accent:#0f766e; --accent-soft:#e6f4f1; --chip:#f1f5f9; --shadow:0 1px 3px rgba(0,0,0,.08);
    --zebra:#fafbfc;
    --hit:#ecfdf5; --hit-line:#10b981; --hit-text:#065f46;
    --warn:#fffbeb; --warn-line:#f59e0b; --warn-text:#92400e;
    --alert:#fef2f2; --alert-line:#ef4444; --alert-text:#991b1b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
      --accent:#2dd4bf; --accent-soft:#134e4a; --chip:#334155; --shadow:0 1px 3px rgba(0,0,0,.4);
      --zebra:#243247;
      --hit:#064e3b; --hit-line:#34d399; --hit-text:#a7f3d0;
      --warn:#422006; --warn-line:#f59e0b; --warn-text:#fde68a;
      --alert:#450a0a; --alert-line:#f87171; --alert-text:#fecaca;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.5;}
  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
    padding:12px 20px 10px;box-shadow:var(--shadow)}
  .wrap{max-width:1400px;margin:0 auto}
  .hrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
  .sub{font-size:12px;color:var(--muted)}
  .grow{flex:1}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
    background:var(--chip);color:var(--text);padding:7px 13px}
  button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
  button:hover{filter:brightness(1.06)}
  /* ===== 右側工具抽屜 ===== */
  .drawer{position:fixed;top:0;right:0;height:100%;z-index:60;display:flex;align-items:center;
    pointer-events:none}
  .drawer .handle{pointer-events:auto;writing-mode:vertical-rl;text-orientation:mixed;
    padding:16px 7px;border-radius:10px 0 0 10px;border:1px solid var(--accent);border-right:0;
    background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.08em;
    box-shadow:-2px 0 10px rgba(0,0,0,.15);cursor:pointer}
  .drawer .handle:hover{filter:brightness(1.1)}
  .drawer .dpanel{pointer-events:auto;width:0;overflow:hidden;transition:width .18s ease;
    height:100%;background:var(--card);border-left:1px solid var(--line);
    box-shadow:-6px 0 24px rgba(0,0,0,.18)}
  .drawer.open .dpanel{width:min(300px,86vw)}
  .dinner{width:min(300px,86vw);height:100%;overflow-y:auto;padding:16px 14px;
    display:flex;flex-direction:column;gap:8px}
  .dtitle{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:2px}
  .dnote{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.6;
    border-top:1px dashed var(--line);padding-top:10px}
  .tool{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
    font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px;
    border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);
    cursor:pointer;line-height:1.35}
  .tool:hover{background:var(--accent);color:#fff}
  .tool .ticon{font-size:15px;line-height:1.2}
  .tool .tnote{display:block;font-weight:500;opacity:.8;font-size:11px;margin-top:2px}
  #toolbar:empty{display:none}

  /* ===== 給藥途徑篩選 ===== */
  .routes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
  .routes:empty{display:none}
  .rlabel{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);
    text-transform:uppercase;margin-right:2px}
  .rchip{font-size:12px;font-weight:700;padding:4px 12px;border-radius:7px;
    border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .rchip:hover{border-style:solid;color:var(--text)}
  .rchip.on{background:var(--text);color:var(--bg);border-color:var(--text);border-style:solid}
  .rclear{font-size:11px;color:var(--muted);background:none;border:0;padding:4px 6px;
    text-decoration:underline;cursor:pointer}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tab{font-size:13px;padding:7px 14px;border-radius:99px}
  .tab.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}
  .subtabs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;margin-top:2px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .stab{font-size:12.5px;padding:5px 12px;border-radius:99px;background:var(--card)}
  .stab.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
  #search{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:inherit;margin-top:10px}
  main{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
  .status{font-size:13px;color:var(--muted);margin:4px 0 14px}
  .tblwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
  th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--chip);font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;z-index:5}
  tbody tr:nth-child(even){background:var(--zebra)}
  td .v{white-space:pre-wrap}
  td.drugcell{min-width:170px}
  .dn{font-weight:700}
  .di{color:var(--accent);font-size:12px;font-weight:600}
  .rt{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:10px;
    font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .na{color:var(--muted)}
  .drug{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;
    box-shadow:var(--shadow);overflow:hidden}
  .dhead{padding:13px 16px 4px}
  .fields{display:grid;grid-template-columns:repeat(var(--fcols,3),minmax(0,1fr));gap:10px 18px;
    padding:8px 16px 14px}
  .f{font-size:13px}
  .f .k{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .f .v{white-space:pre-wrap}
  mark{background:#fde68a;color:#111;border-radius:3px}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.6}

  /* ===== 病人資訊面板 ===== */
  .titlerow{margin-top:10px;align-items:baseline;gap:10px}
  .titlerow h1{font-size:15px}
  .pt{margin-top:0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .pthead{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;
    font-size:13px;font-weight:600;user-select:none}
  .pthead .caret{transition:transform .15s;font-size:11px;color:var(--muted)}
  .pt.open .pthead .caret{transform:rotate(90deg)}
  .ptsum{font-weight:500;color:var(--muted);font-size:12px;flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .ptsum b{color:var(--accent);font-weight:700}
  .ptbody{display:none;padding:2px 12px 12px;border-top:1px solid var(--line)}
  .pt.open .ptbody{display:block}
  .ptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px 10px;margin-top:10px}
  .ptf label{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin-bottom:3px}
  .ptf input,.ptf select{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:inherit;font-size:13px}
  .ptcalc{margin-top:10px;display:flex;flex-direction:column;gap:5px}
  .cgrow{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .cgk{flex:0 0 66px;font-size:11px;font-weight:800;color:var(--muted);text-align:right;
    letter-spacing:.03em;line-height:1.25}
  .cgk i{display:block;font-style:normal;font-size:9.5px;font-weight:500;opacity:.75}
  .cgvs{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
  .cgv{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:7px;
    padding:3px 9px;white-space:nowrap}
  .cgv b{color:var(--text);font-weight:800;font-size:13.5px}
  .cgv i{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:3px}
  .cgv.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cgv.on b{color:var(--accent)}
  .cgv.on::after{content:"採用";font-size:9.5px;color:var(--accent);font-weight:800;margin-left:5px;
    opacity:.85}
  .cgv.trait{background:var(--hit);border-color:var(--hit-line);color:var(--hit-text);font-weight:700}
  .cgv.trait i{color:var(--hit-text);opacity:.8}
  @media (max-width:560px){.cgk{flex-basis:100%;text-align:left}.cgk i{display:inline;margin-left:6px}}
  .ptact{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .ptnote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}

  /* ===== 條件片段 ===== */
  .seg{white-space:pre-wrap;padding:4px 0;font-size:13.5px}
  .seg+.seg{border-top:1px dashed var(--line)}
  .seg.hit{background:var(--hit);border-left:3px solid var(--hit-line);color:var(--hit-text);
    padding:4px 8px;border-radius:0 6px 6px 0;font-weight:600;border-top:0}
  .seg.hit .tick{font-weight:800;margin-right:4px}
  .seg.dim{color:var(--muted)}
  .seg.hit.uncond{background:transparent;border-left-color:var(--line);color:inherit;font-weight:500}
  .seg.hit.uncond .tick{color:var(--muted)}

  /* ===== 綜合結論 ===== */
  .concl{border:2px solid var(--hit-line);background:var(--hit);border-radius:12px;
    margin:12px 16px;padding:12px 14px}
  .concl.amb{border-color:var(--warn-line);background:var(--warn)}
  .concl.non{border-color:var(--line);background:var(--chip)}
  .ck{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;
    color:var(--hit-text);opacity:.85;margin-bottom:7px}
  .concl.amb .ck{color:var(--warn-text)}
  .concl.non .ck{color:var(--muted)}
  .ck2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;
    color:var(--muted);margin:13px 0 5px}
  .cdose{font-size:19px;font-weight:800;line-height:1.35;color:var(--hit-text)}
  .concl.amb .cdose{color:var(--warn-text)}
  .concl.non .cdose{color:var(--text);font-size:16px}
  .cbase{font-size:12px;color:var(--hit-text);opacity:.85;margin-top:6px}
  .concl.amb .cbase{color:var(--warn-text)}
  .concl.non .cbase{color:var(--muted)}

  /* 結論表格 */
  .ctab{width:100%;border-collapse:collapse;background:var(--card);border-radius:9px;
    overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);table-layout:auto}
  .ctab th{position:static;background:var(--chip);color:var(--muted);font-size:10.5px;
    font-weight:700;letter-spacing:.05em;text-transform:none;padding:6px 10px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  .ctab td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  .ctab tr:last-child td{border-bottom:0}
  .ctab .kk{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
  .ctab .vv{font-weight:600;line-height:1.45;word-break:break-word;white-space:pre-line}
  .ctab.main .vv{font-size:16px;font-weight:800;color:var(--hit-text)}
  .concl.amb .ctab.main .vv{color:var(--warn-text)}
  .ctab.why td{font-size:13px}
  .ctab.why .vv{font-weight:500}
  .ctab .jj{font-size:11.5px;font-weight:800;white-space:nowrap;color:var(--accent)}
  .ctab .jj.none{color:var(--muted)}
  .ctab .jj.dose{color:var(--alert-line)}
  .ctab .dimrow .vv{color:var(--muted);font-weight:500}
  .src{font-size:11.5px;color:var(--muted);word-break:break-word}
  .src.dash{opacity:.5}
  .srcinline{display:none;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}

  .cwarn{margin-top:10px;font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:8px;
    background:var(--alert);color:var(--alert-text);border:1px solid var(--alert-line);line-height:1.5}
  .cmiss{margin-top:10px;font-size:12.5px;padding:8px 10px;border-radius:8px;
    background:var(--card);color:var(--muted);border:1px dashed var(--line);line-height:1.5}

  details.det{margin:0 16px 14px}
  details.det>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);
    outline:none;padding:8px 11px;background:var(--accent-soft);border-radius:8px;list-style:none}
  details.det>summary::-webkit-details-marker{display:none}
  details.det>summary::before{content:"▸ ";display:inline-block}
  details.det[open]>summary::before{content:"▾ "}
  .dsec{border:1px solid var(--line);border-radius:10px;margin-top:9px;overflow:hidden;
    background:var(--card)}
  .dsec.gone{opacity:.55}
  .dsec.gone .db .v{text-decoration:line-through}
  .dsec .dh{padding:7px 11px;background:var(--chip);font-size:12.5px;font-weight:800;
    letter-spacing:.02em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dsec .dh .tag{font-size:10.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);
    color:var(--accent);font-weight:700}
  .dsec .dh .gp{font-weight:500;color:var(--muted);font-size:12px}
  .dsec .dh .src{margin-left:auto;font-weight:500}
  .dsec .db{padding:9px 11px;font-size:13.5px}
  .dsec .db .v{white-space:pre-wrap}
  .disc{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);
    margin:0 16px;padding:10px 0 12px;line-height:1.6}
  @media (max-width:760px){
    /* 窄畫面把「來源」收到內容下方，避免表格被裁掉 */
    .ctab .srccol{display:none}
    .srcinline{display:block}
  }
  @media (max-width:560px){
    .ctab td,.ctab.main .vv{font-size:14px}
    .ctab .kk,.ctab .jj{font-size:11.5px}
    .concl{margin:12px 10px;padding:10px}
    details.det{margin:0 10px 12px}
    .dsec .dh{font-size:12px}
  }

  /* ===== 額外功能按鈕 / 彈出視窗 ===== */
  .xbtn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;
    padding:5px 11px;border-radius:99px;border:1px solid var(--accent);
    background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;
    line-height:1.2;white-space:nowrap}
  .xbtn:hover{background:var(--accent);color:#fff}
  .xbtn::before{content:"\1F9EE";font-size:12px}
  .modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(15,23,42,.6);
    backdrop-filter:blur(2px);padding:16px}
  .modal.on{display:flex;align-items:center;justify-content:center}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    width:min(1000px,100%);height:min(88vh,900px);display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .mhead{display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-bottom:1px solid var(--line);background:var(--chip)}
  .mtitle{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mhead a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
  .mhead button{padding:4px 10px;font-size:13px}
  .mbody{flex:1;position:relative;background:#fff}
  .mbody iframe{width:100%;height:100%;border:0;display:block}
  .mfall{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--muted);
    font-size:13px;background:var(--card)}
  .mfall.on{display:flex}
  @media (max-width:900px){.fields{--fcols:2}}
  @media (max-width:560px){.fields{--fcols:1}}
  @media (max-width:560px){header{position:static}}
  .tipi{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;
    border:1px solid var(--muted);border-radius:50%;color:var(--muted);font:italic 700 10px/1 Georgia,serif;
    cursor:help;vertical-align:middle;user-select:none;flex:none;text-transform:none;letter-spacing:0}
  .tipi:hover,.tipi.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #tip{position:fixed;z-index:999;display:none;max-width:360px;padding:9px 11px;border-radius:7px;
    background:#1f2933;color:#f1f5f9;font-size:12.5px;line-height:1.6;white-space:pre-line;
    box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none;text-align:left}
</style>
</head>
<body>
<div id="tip"></div>
<header>
 <div class="wrap">
  <div class="pt" id="pt">
    <div class="pthead" id="pthead">
      <span class="caret">▶</span>
      <span>病人資訊<span class="tipi" data-tip="肥胖／低體重／高齡／兒科由身高體重與年齡自動判定，不需勾選；試算表中沒有對應欄位的特性會自動隱藏。&#10;表中寫 CrCl 的條文用 CrCl 判定、寫 eGFR 的用 eGFR 判定。&#10;腎功能不穩定、AKI、極端體型或肌肉量異常者不適用；所有結論僅為文獻條件比對，須經專業判讀。">i</span></span>
      <span class="ptsum" id="ptsum">尚未輸入 — 點此展開填寫，可自動比對劑量條件</span>
    </div>
    <div class="ptbody">
      <div class="ptgrid">
        <div class="ptf"><label>年齡 (歲)</label><input id="p_age" type="number" inputmode="decimal" step="0.01" min="0" max="120" placeholder="未滿1歲用小數 0.25"></div>
        <div class="ptf"><label>性別</label><select id="p_sex"><option value="M">男</option><option value="F">女</option></select></div>
        <div class="ptf"><label>身高 (cm)</label><input id="p_ht" type="number" inputmode="decimal" min="0"></div>
        <div class="ptf"><label>體重 (kg)</label><input id="p_wt" type="number" inputmode="decimal" min="0"></div>
        <div class="ptf"><label>血清肌酸酐 SCr (mg/dL)</label><input id="p_scr" type="number" inputmode="decimal" step="0.01" min="0"></div>
        <div class="ptf"><label>CrCl 採用體重<span class="tipi" data-tip="Cockcroft-Gault 代入哪一種體重：&#10;Total BW＝實際體重&#10;Ideal BW＝理想體重（Devine）&#10;Adjusted BW＝IBW + 0.4 ×（TBW − IBW）&#10;三者結果會一併列出，框線標示採用者。">i</span></label><select id="p_wsel">
          <option value="tbw">Total BW</option>
          <option value="ibw">Ideal BW</option>
          <option value="adj">Adjusted BW</option></select></div>
        <div class="ptf"><label>直接指定 CrCl<span class="tipi" data-tip="填已知的 CrCl 或 eGFR（mL/min），會覆寫公式估算值。&#10;肌酸酐請填 SCr 欄。">i</span></label><input id="p_crclman" type="number" inputmode="decimal" step="0.1" min="0" placeholder="已知廓清率，非肌酸酐" title="填已知的 CrCl 或 eGFR（mL/min），會覆寫公式估算值。肌酸酐請填左邊的 SCr 欄。"></div>
        <div class="ptf"><label>腎臟替代治療</label><select id="p_dial">
          <option value="none">無</option><option value="HD">HD 血液透析</option>
          <option value="PD">PD 腹膜透析</option><option value="CRRT">CRRT</option></select></div>

m{padding:2px 10px;font-size:12px}\n.btnrow{display:flex;gap:10px;margin:4px 0 14px}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}\nth{color:var(--muted);font-weight:500;font-size:12.5px}\ntd.v{font-variant-numeric:tabular-nums;font-weight:600}\ntr.sec td{background:var(--bg);color:var(--accent2);font-weight:600;font-size:12.5px}\n.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n.nav button{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:14px}\n.nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}\n.page{display:none}.page.on{display:block}\n.flag{padding:8px 10px;border-radius:6px;font-size:13px;margin-top:10px}\n.f-ok{background:var(--okbg);color:var(--ok)}.f-warn{background:var(--warnbg);color:var(--warn)}.f-bad{background:var(--badbg);color:var(--bad)}\n.note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}\n.err{font-size:12.5px;color:var(--bad);margin-top:8px}\n.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}\n.scroll{overflow-x:auto}\n.unit{display:flex;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--muted);white-space:nowrap}\n.cmp td,.cmp th{white-space:nowrap}\n.cmp tr.best{background:var(--okbg)}\n.cmp tr.best td:first-child::after{content:\"建議\";margin-left:6px;font-size:10.5px;background:var(--ok);color:#fff;padding:1px 6px;border-radius:8px}\n.cmp tr.bad{opacity:.5}\n.tag{font-size:11px;padding:1px 6px;border-radius:8px}\n.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}\n.alerts li{font-size:12.5px;color:var(--warn);margin-bottom:4px}\ncanvas{max-width:100%;width:100%}\n.i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border:1px solid var(--muted);border-radius:50%;color:var(--muted);font:italic 700 10px/1 Georgia,serif;cursor:help;vertical-align:middle;user-select:none}\n.i:hover,.i.on{background:var(--accent2);border-color:var(--accent2);color:#fff}\n#tip{position:fixed;z-index:999;display:none;max-width:320px;padding:9px 11px;border-radius:7px;background:#1f2933;color:#f1f5f9;font-size:12.5px;line-height:1.6;white-space:pre-line;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none}\n.dt{display:flex;gap:6px}.dt input[type=date]{flex:1.4}.dt input[type=text]{flex:1}\nbutton.rpt{background:var(--ok)}\n#rptBox{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(15,20,25,.55);padding:16px}\n#rptBox.on{display:flex}\n#rptBox .dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(820px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}\n#rptBox .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}\n#rptBox .hd b{flex:1;color:var(--accent);font-size:15px}\n#rptBox .view{display:flex;flex-direction:column;min-height:0;flex:1}\n#rptBox .opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px 0}\n#rptBox .opts label{display:flex;align-items:center;gap:6px;margin:0;color:var(--muted);font-size:12.5px}\n#rptBox .opts select,#rptBox .opts input{width:auto;padding:4px 8px;font-size:13px}\n#rptBox .cloud{margin-left:auto;font-size:12.5px;color:var(--muted)}\n#rptBox .cloud a{color:var(--accent2)}\n#rptText,#te_text{flex:1;min-height:340px;margin:10px 16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);\n  font:14px/1.7 ui-monospace,Menlo,Consolas,\"Noto Sans TC\",monospace;resize:vertical;white-space:pre-wrap}\n#rptBox .ft{display:flex;gap:8px;align-items:center;padding:0 16px 14px;flex-wrap:wrap}\n#rptBox .ft .msg{flex:1;font-size:12.5px;color:var(--ok)}\n.tehelp{padding:8px 16px 0;font-size:12.5px;color:var(--muted)}\n.tehelp code{background:var(--bg);padding:1px 4px;border-radius:4px}\n.toks{display:flex;flex-wrap:wrap;gap:5px;padding:0 16px 12px;max-height:130px;overflow:auto}\n.tok{background:var(--bg);color:var(--accent);border:1px solid var(--line);padding:3px 8px;font:12px ui-monospace,Menlo,monospace;border-radius:5px}\n.tok small{font-family:-apple-system,\"Noto Sans TC\",sans-serif;color:var(--muted);margin-left:5px;font-size:11px}\n.tok:hover{border-color:var(--accent2)}\n<\/style>\n<\/head>\n<body>\n<div id=\"tip\"><\/div>\n<div id=\"rptBox\"><div class=\"dlg\">\n  <div class=\"hd\"><b>📝 劑量建議<\/b><button class=\"ghost sm\" onclick=\"closeReport()\">關閉 ✕<\/button><\/div>\n\n  <div id=\"rptView\" class=\"view\">\n    <div class=\"opts\">\n      <label>模板 <select id=\"ro_tpl\" onchange=\"pickTpl()\"><\/select><\/label>\n      <button class=\"ghost sm\" onclick=\"openTplEditor()\">✎ 編輯模板<\/button>\n      <label>Lab date <input type=\"date\" id=\"ro_date\" onchange=\"regenReport()\"><\/label>\n      <span class=\"cloud\" id=\"ro_cloud\"><\/span>\n    <\/div>\n    <textarea id=\"rptText\" spellcheck=\"false\" oninput=\"RPT_DIRTY=true\"><\/textarea>\n    <div class=\"ft\"><span class=\"msg\" id=\"rptMsg\"><\/span>\n      <button class=\"ghost\" onclick=\"regenReport()\">↺ 重新產生<\/button>\n      <button onclick=\"copyReport()\">複製文字<\/button><\/div>\n  <\/div>\n\n  <div id=\"tplView\" class=\"view\" style=\"display:none\">\n    <div class=\"opts\"><label style=\"flex:1\">模板名稱 <input id=\"te_name\" style=\"flex:1\"><\/label><\/div>\n    <div class=\"tehelp\">在內容中放入 <code>{欄位}<\/code>，產出時會自動換成數值；點下方按鈕可插入到游標位置。沒有數值的欄位會留空格。<\/div>\n    <textarea id=\"te_text\" spellcheck=\"false\" style=\"min-height:260px\"><\/textarea>\n    <div class=\"toks\" id=\"te_tokens\"><\/div>\n    <div class=\"ft\">\n      <button class=\"ghost\" id=\"te_del\" onclick=\"delTpl()\" style=\"color:var(--bad)\">刪除<\/button>\n      <span class=\"msg\"><\/span>\n      <button class=\"ghost\" onclick=\"closeTplEditor()\">取消<\/button>\n      <button class=\"ghost\" onclick=\"previewTpl()\">預覽<\/button>\n      <button class=\"ghost\" id=\"te_saveas\" onclick=\"saveTpl(true)\">另存新模板<\/button>\n      <button id=\"te_save\" onclick=\"saveTpl(false)\">儲存<\/button><\/div>\n  <\/div>\n<\/div><\/div>\n\n<div class=\"wrap\">\n<h1>Vancomycin 計算器<\/h1>\n\n<div class=\"nav\">\n  <button class=\"on\" data-p=\"init\">Initial Dosing<\/button>\n  <button data-p=\"sst\">Steady-State Trough<\/button>\n  <button data-p=\"pt\">Steady-State Peak &amp; Trough<\/button>\n<\/div>\n\n<!-- ============================ Initial Dosing ============================ -->\n<div class=\"page on\" id=\"page-init\">\n<div class=\"card\">\n  <h2>病人資料<\/h2>\n  <div class=\"grid\">\n    <div><label>Age (years)<\/label><input id=\"age\" type=\"number\"><\/div>\n    <div><label>SCr<\/label><div style=\"display:flex;gap:6px\">\n      <input id=\"scr\" type=\"number\" step=\"0.01\">\n      <span class=\"unit\">mg/dL<\/span><\/div><\/div>\n    <div><label>Height<\/label><div style=\"display:flex;gap:6px\">\n      <input id=\"ht\" type=\"number\" step=\"0.1\">\n      <span class=\"unit\">cm<\/span><\/div><\/div>\n    <div><label>Actual body weight<\/label><div style=\"display:flex;gap:6px\">\n      <input id=\"wt\" type=\"number\" step=\"0.1\">\n      <span class=\"unit\">kg<\/span><\/div><\/div>\n    <div><label>性別<\/label>\n      <div class=\"radios\">\n        <label><input type=\"radio\" name=\"sex\" value=\"M\" checked>男<\/label>\n        <label><input type=\"radio\" name=\"sex\" value=\"F\">女<\/label>\n      <\/div><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Goal<\/h2>\n  <div class=\"grid\">\n    <div><label>Trough<\/label>\n      <div style=\"display:flex;gap:6px\"><select id=\"i_grange\"><option>10-15<\/option><option selected>15-20<\/option><\/select><span class=\"unit\">mcg/mL<\/span><\/div><\/div>\n    <div><label>AUC₂₄<\/label>\n      <div style=\"padding:7px 0;font-weight:600\">400–600 <span style=\"color:var(--muted);font-weight:400;font-size:12.5px\">mg·hr/L<\/span><\/div><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Settings<\/h2>\n  <div class=\"grid\">\n    <div><label>Infusion rate<\/label>\n      <div style=\"display:flex;gap:6px\"><input id=\"rate\" type=\"number\" placeholder=\"自動\"><span class=\"unit\">mg/hr<\/span><\/div>\n      <div class=\"note\" id=\"rateNote\" style=\"margin-top:4px\"><\/div><\/div>\n    <div><label>Amputations<\/label>\n      <select id=\"amp\">\n        <option value=\"1\">None<\/option>\n        <option value=\"0.985\">Forearm (IBW -1.5%)<\/option>\n        <option value=\"0.96\">Entire arm (IBW -4%)<\/option>\n        <option value=\"0.985\">Foot (IBW -1.5%)<\/option>\n        <option value=\"0.965\">Below knee (IBW -3.5%)<\/option>\n        <option value=\"0.89\">Above knee (IBW -11%)<\/option>\n        <option value=\"0.84\">Entire leg (IBW -16%)<\/option>\n        <option value=\"0.8\">Multiple (IBW -20%)<\/option>\n        <option value=\"0.75\">Multiple (IBW -25%)<\/option>\n        <option value=\"0.7\">Multiple (IBW -30%)<\/option>\n        <option value=\"0.65\">Multiple (IBW -35%)<\/option>\n      <\/select><\/div>\n    <div><label>IDMS SCr<\/label>\n      <div class=\"radios\">\n        <label><input type=\"radio\" name=\"idms\" value=\"1\">On<\/label>\n        <label><input type=\"radio\" name=\"idms\" value=\"0\" checked>Off<\/label>\n      <\/div><\/div>\n    <div><label>Slope<\/label><input id=\"slope\" type=\"number\" step=\"0.001\" value=\"1.065\" disabled><\/div>\n    <div><label>Y-Intercept<\/label><input id=\"yint\" type=\"number\" step=\"0.001\" value=\"0.067\" disabled><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"btnrow\"><button onclick=\"calc()\">計算<\/button><button class=\"ghost\" onclick=\"clearPage('init')\">重設<\/button><\/div>\n\n<div class=\"card\">\n  <h2>Estimated PK Parameters<\/h2>\n  <div class=\"scroll\"><table id=\"pk\"><\/table><\/div>\n  <div class=\"note\" id=\"pkNote\"><\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Initial Dosing<\/h2>\n  <div class=\"two\">\n    <div>\n      <div class=\"grid\">\n        <div><label>負荷劑量 LD (mg)<\/label>\n          <select id=\"ld\"><option value=\"0\">0<\/option><option>750<\/option><option>1000<\/option><option>1250<\/option><option>1500<\/option><option>1750<\/option><option>2000<\/option><option>2250<\/option><option>2500<\/option><option>3000<\/option><\/select><\/div>\n        <div><label>LD 起始→維持劑量起始 (hr)<\/label><input id=\"ldgap\" type=\"number\" step=\"0.1\"><\/div>\n        <div><label>劑量 Dose<\/label>\n          <div style=\"display:flex;gap:6px\"><input id=\"doseAlt\" type=\"number\" step=\"250\"><span class=\"unit\">mg<\/span><\/div><\/div>\n        <div><label>間隔 Interval<\/label>\n          <div style=\"display:flex;gap:6px\">\n            <select id=\"tau\"><option>6<\/option><option>8<\/option><option>12<\/option><option>18<\/option><option>24<\/option><option>36<\/option><option>48<\/option><option>72<\/option><\/select>\n            <span class=\"unit\">hrs<\/span><\/div><\/div>\n      <\/div>\n      <div class=\"btnrow\" style=\"margin:10px 0 0\"><button onclick=\"addCompare('init')\">＋ 加入比較<\/button><button class=\"rpt\" onclick=\"openReport('init')\">📝 產出建議<\/button><\/div>\n      <div class=\"note\" id=\"recNote\"><\/div>\n    <\/div>\n    <div class=\"scroll\"><table id=\"tInit\"><\/table><\/div>\n  <\/div>\n  <div id=\"fInit\"><\/div>\n  <ul class=\"alerts\" id=\"aInit\"><\/ul>\n<\/div>\n\n<div class=\"card\"><h2>給藥方案比較<\/h2><div class=\"scroll\"><table class=\"cmp\" id=\"cmp_init\"><\/table><\/div><div id=\"cmpNote_init\"><\/div><\/div>\n<div class=\"card\"><h2>藥動模擬圖<\/h2><canvas id=\"chart_init\" height=\"260\"><\/canvas><\/div>\n<\/div>\n\n<!-- ============================ Steady-State Trough ============================ -->\n<div class=\"page\" id=\"page-sst\">\n<div class=\"card\">\n  <h2>病人資料<\/h2>\n  <div class=\"grid\">\n    <div><label>Age (years)<\/label><input id=\"t_age\" type=\"number\"><\/div>\n    <div><label>SCr (mg/dL)<\/label><input id=\"t_scr\" type=\"number\" step=\"0.01\"><\/div>\n    <div><label>Height (cm)<\/label><input id=\"t_ht\" type=\"number\" step=\"0.1\"><\/div>\n    <div><label>Actual body weight (kg)<\/label><input id=\"t_wt\" type=\"number\" step=\"0.1\"><\/div>\n    <div><label>性別<\/label>\n      <div class=\"radios\">\n        <label><input type=\"radio\" name=\"t_sex\" value=\"M\" checked>男<\/label>\n        <label><input type=\"radio\" name=\"t_sex\" value=\"F\">女<\/label>\n      <\/div><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Goal<\/h2>\n  <div class=\"grid\">\n    <div><label>Trough<\/label>\n      <div style=\"display:flex;gap:6px\"><select id=\"s_grange\"><option>10-15<\/option><option selected>15-20<\/option><\/select><span class=\"unit\">mcg/mL<\/span><\/div><\/div>\n    <div><label>AUC₂₄<\/label>\n      <div style=\"padding:7px 0;font-weight:600\">400–600 <span style=\"color:var(--muted);font-weight:400;font-size:12.5px\">mg·hr/L<\/span><\/div><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Settings<\/h2>\n  <div class=\"grid\">\n    <div><label>Infusion rate<\/label>\n      <div style=\"display:flex;gap:6px\"><input id=\"s_rate\" type=\"number\" placeholder=\"自動\"><span class=\"unit\">mg/hr<\/span><\/div><\/div>\n    <div><label>Amputations<\/label>\n      <select id=\"t_amp\">\n        <option value=\"1\">None<\/option>\n        <option value=\"0.985\">Forearm (IBW -1.5%)<\/option>\n        <option value=\"0.96\">Entire arm (IBW -4%)<\/option>\n        <option value=\"0.985\">Foot (IBW -1.5%)<\/option>\n        <option value=\"0.965\">Below knee (IBW -3.5%)<\/option>\n        <option value=\"0.89\">Above knee (IBW -11%)<\/option>\n        <option value=\"0.84\">Entire leg (IBW -16%)<\/option>\n        <option value=\"0.8\">Multiple (IBW -20%)<\/option>\n        <option value=\"0.75\">Multiple (IBW -25%)<\/option>\n        <option value=\"0.7\">Multiple (IBW -30%)<\/option>\n        <option value=\"0.65\">Multiple (IBW -35%)<\/option>\n      <\/select><\/div>\n    <div><label>IDMS SCr<\/label>\n      <div class=\"radios\">\n        <label><input type=\"radio\" name=\"t_idms\" value=\"1\">On<\/label>\n        <label><input type=\"radio\" name=\"t_idms\" value=\"0\" checked>Off<\/label>\n      <\/div><\/div>\n    <div><label>Slope<\/label><input id=\"t_slope\" type=\"number\" step=\"0.001\" value=\"1.065\" disabled><\/div>\n    <div><label>Y-Intercept<\/label><input id=\"t_yint\" type=\"number\" step=\"0.001\" value=\"0.067\" disabled><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Steady-State Trough<\/h2>\n  <div class=\"two\">\n    <div>\n      <div class=\"grid\">\n        <div style=\"grid-column:1/-1\"><label>計算模式<\/label>\n          <select id=\"s_mode\">\n            <option value=\"est\">Use estimated Ke and Vd<\/option>\n            <option value=\"vd\">Vd is known<\/option>\n            <option value=\"ke\">Ke is known<\/option>\n          <\/select><\/div>\n        <div id=\"s_vdBox\" style=\"display:none\"><label>Vd (L)<\/label><input id=\"s_vd\" type=\"number\" step=\"0.1\"><\/div>\n        <div id=\"s_keBox\" style=\"display:none\"><label>Ke (hr⁻¹)<\/label><input id=\"s_ke\" type=\"number\" step=\"0.0001\"><\/div>\n        <div><label>目前劑量 (mg)<\/label><input id=\"s_dose\" type=\"number\" step=\"250\"><\/div>\n        <div><label>目前間隔 τ (hr)<\/label>\n          <select id=\"s_tau\"><option>6<\/option><option>8<\/option><option selected>12<\/option><option>18<\/option><option>24<\/option><option>36<\/option><option>48<\/option><option>72<\/option><\/select><\/div>\n        <div><label>量測濃度 (mcg/mL)<\/label><input id=\"s_c\" type=\"number\" step=\"0.1\"><\/div>\n      <\/div>\n      <h3>給藥開始<\/h3>\n      <div class=\"dt\"><input id=\"s_d1\" type=\"date\"><input id=\"s_t1\" type=\"text\" placeholder=\"HH:MM\" inputmode=\"numeric\" maxlength=\"5\"><\/div>\n      <h3>抽血<\/h3>\n      <div class=\"dt\"><input id=\"s_d2\" type=\"date\"><input id=\"s_t2\" type=\"text\" placeholder=\"HH:MM\" inputmode=\"numeric\" maxlength=\"5\"><\/div>\n      <div class=\"grid\" style=\"margin-top:10px\">\n        <div><label>給藥開始→抽血 (hr)<\/label><input id=\"s_t\" type=\"text\" readonly><\/div>\n      <\/div>\n      <div class=\"btnrow\" style=\"margin:14px 0 0\"><button onclick=\"calcSST()\">計算<\/button><button class=\"ghost\" onclick=\"clearPage('sst')\">重設<\/button><\/div>\n      <div class=\"err\" id=\"s_err\"><\/div>\n    <\/div>\n    <div class=\"scroll\"><table id=\"tSST\"><\/table><\/div>\n  <\/div>\n  <div id=\"fSST\"><\/div><ul class=\"alerts\" id=\"aSST\"><\/ul>\n<\/div>\n\n<div class=\"card\">\n  <h2>建議劑量<\/h2>\n  <div class=\"two\">\n    <div>\n      <div class=\"grid\">\n        <div><label>劑量 Dose<\/label>\n          <div style=\"display:flex;gap:6px\"><input id=\"s_ndose\" type=\"number\" step=\"250\"><span class=\"unit\">mg<\/span><\/div><\/div>\n        <div><label>間隔 Interval<\/label>\n          <div style=\"display:flex;gap:6px\">\n            <select id=\"s_ntau\"><option>6<\/option><option>8<\/option><option>12<\/option><option>18<\/option><option>24<\/option><option>36<\/option><option>48<\/option><option>72<\/option><\/select>\n            <span class=\"unit\">hrs<\/span><\/div><\/div>\n      <\/div>\n      <div class=\"btnrow\" style=\"margin:10px 0 0\"><button onclick=\"addCompare('sst')\">＋ 加入比較<\/button><button class=\"rpt\" onclick=\"openReport('sst')\">📝 產出建議<\/button><\/div>\n      <div class=\"note\" id=\"s_rec\"><\/div>\n    <\/div>\n    <div class=\"scroll\"><table id=\"s_adopt\"><\/table><\/div>\n  <\/div>\n  <div id=\"fSSTn\"><\/div>\n<\/div>\n\n<div class=\"card\"><h2>給藥方案比較<\/h2><div class=\"scroll\"><table class=\"cmp\" id=\"cmp_sst\"><\/table><\/div><div id=\"cmpNote_sst\"><\/div><\/div>\n<div class=\"card\"><h2>藥動模擬圖<\/h2><canvas id=\"chart_sst\" height=\"260\"><\/canvas><\/div>\n<\/div>\n\n<!-- ============================ Steady-State Peak & Trough ============================ -->\n<div class=\"page\" id=\"page-pt\">\n<div class=\"card\">\n  <h2>Goal<\/h2>\n  <div class=\"grid\">\n    <div><label>Trough<\/label>\n      <div style=\"display:flex;gap:6px\"><select id=\"q_grange\"><option>10-15<\/option><option selected>15-20<\/option><\/select><span class=\"unit\">mcg/mL<\/span><\/div><\/div>\n    <div><label>AUC₂₄<\/label>\n      <div style=\"padding:7px 0;font-weight:600\">400–600 <span style=\"color:var(--muted);font-weight:400;font-size:12.5px\">mg·hr/L<\/span><\/div><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Settings<\/h2>\n  <div class=\"grid\">\n    <div><label>Infusion rate<\/label>\n      <div style=\"display:flex;gap:6px\"><input id=\"q_rate\" type=\"number\" placeholder=\"自動\"><span class=\"unit\">mg/hr<\/span><\/div><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Steady-State Peak &amp; Trough<\/h2>\n  <div class=\"two\">\n    <div>\n      <div class=\"grid\">\n        <div><label>劑量 (mg)<\/label><input id=\"q_dose\" type=\"number\" step=\"250\"><\/div>\n        <div><label>間隔 τ (hr)<\/label>\n          <select id=\"q_tau\"><option>6<\/option><option>8<\/option><option selected>12<\/option><option>18<\/option><option>24<\/option><option>36<\/option><option>48<\/option><option>72<\/option><\/select><\/div>\n        <div><label>Peak 濃度 (mcg/mL)<\/label><input id=\"q_pk\" type=\"number\" step=\"0.1\"><\/div>\n        <div><label>Trough 濃度 (mcg/mL)<\/label><input id=\"q_tr\" type=\"number\" step=\"0.1\"><\/div>\n      <\/div>\n      <div class=\"two\" style=\"margin-top:4px\">\n        <div>\n          <h3>Peak 給藥開始<\/h3>\n          <div class=\"dt\"><input id=\"q_d0\" type=\"date\"><input id=\"q_h0\" type=\"text\" placeholder=\"HH:MM\" inputmode=\"numeric\" maxlength=\"5\"><\/div>\n          <h3>Peak 抽血<\/h3>\n          <div class=\"dt\"><input id=\"q_d1\" type=\"date\"><input id=\"q_h1\" type=\"text\" placeholder=\"HH:MM\" inputmode=\"numeric\" maxlength=\"5\"><\/div>\n          <div style=\"margin-top:10px\"><label>給藥開始→Peak (hr)<\/label><input id=\"q_tpk\" type=\"text\" readonly><\/div>\n        <\/div>\n        <div>\n          <h3>Trough 給藥開始<\/h3>\n          <div class=\"dt\"><input id=\"q_d3\" type=\"date\"><input id=\"q_h3\" type=\"text\" placeholder=\"HH:MM\" inputmode=\"numeric\" maxlength=\"5\"><\/div>\n          <h3>Trough 抽血<\/h3>\n          <div class=\"dt\"><input id=\"q_d2\" type=\"date\"><input id=\"q_h2\" type=\"text\" placeholder=\"HH:MM\" inputmode=\"numeric\" maxlength=\"5\"><\/div>\n          <div style=\"margin-top:10px\"><label>給藥開始→Trough (hr)<\/label><input id=\"q_ttr\" type=\"text\" readonly><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"btnrow\" style=\"margin:14px 0 0\"><button onclick=\"calcPT()\">計算<\/button><button class=\"ghost\" onclick=\"clearPage('pt')\">重設<\/button><\/div>\n      <div class=\"err\" id=\"q_err\"><\/div>\n    <\/div>\n    <div class=\"scroll\"><table id=\"tPT\"><\/table><\/div>\n  <\/div>\n  <div id=\"fPT\"><\/div><ul class=\"alerts\" id=\"aPT\"><\/ul>\n<\/div>\n\n<div class=\"card\">\n  <h2>建議劑量<\/h2>\n  <div class=\"two\">\n    <div>\n      <div class=\"grid\">\n        <div><label>劑量 Dose<\/label>\n          <div style=\"display:flex;gap:6px\"><input id=\"q_ndose\" type=\"number\" step=\"250\"><span class=\"unit\">mg<\/span><\/div><\/div>\n        <div><label>間隔 Interval<\/label>\n          <div style=\"display:flex;gap:6px\">\n            <select id=\"q_ntau\"><option>6<\/option><option>8<\/option><option>12<\/option><option>18<\/option><option>24<\/option><option>36<\/option><option>48<\/option><option>72<\/option><\/select>\n            <span class=\"unit\">hrs<\/span><\/div><\/div>\n      <\/div>\n      <div class=\"btnrow\" style=\"margin:10px 0 0\"><button onclick=\"addCompare('pt')\">＋ 加入比較<\/button><button class=\"rpt\" onclick=\"openReport('pt')\">📝 產出建議<\/button><\/div>\n      <div class=\"note\" id=\"q_rec\"><\/div>\n    <\/div>\n    <div class=\"scroll\"><table id=\"q_adopt\"><\/table><\/div>\n  <\/div>\n  <div id=\"fPTn\"><\/div>\n<\/div>\n\n<div class=\"card\"><h2>給藥方案比較<\/h2><div class=\"scroll\"><table class=\"cmp\" id=\"cmp_pt\"><\/table><\/div><div id=\"cmpNote_pt\"><\/div><\/div>\n<div class=\"card\"><h2>藥動模擬圖<\/h2><canvas id=\"chart_pt\" height=\"260\"><\/canvas><\/div>\n<\/div>\n<\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst num=id=>parseFloat($(id).value);\nconst r=(x,d=2)=>(isFinite(x)?x.toFixed(d):\"—\");\nconst MROUND=(x,m)=>Math.round(x/m)*m;\nconst EXP=Math.exp, LN=Math.log;\nconst GP={init:'i',sst:'s',pt:'q'};\nfunction goal(ctx){\n  const x=GP[ctx], type='auc';\n  const range=$(x+'_grange').value, [lo,hi]=range.split('-').map(Number);\n  return {type,range,lo,hi,mid:(lo+hi)/2};\n}\nconst tgt=goal;\n\n\nconst REF={\n  CON:'Rybak MJ, et al. Therapeutic monitoring of vancomycin for serious MRSA infections: revised consensus guideline (ASHP/IDSA/PIDS/SIDP). Am J Health-Syst Pharm 2020;77:835-864.',\n  CG:'Cockcroft DW, Gault MH. Nephron 1976;16:31-41.',\n  SZ:'Sawchuk RJ, Zaske DE. J Pharmacokinet Biopharm 1976;4:183-195.',\n  AMP:'Osterkamp LK. J Am Diet Assoc 1995;95:215-218.',\n  SRC:'VancoPK calx 公式表',\n};\nconst TIPS={\n  'SCr':'Cockcroft-Gault 使用。允許範圍 0.5–10 mg/dL。\\nSCr <0.7 mg/dL 時會提示可考慮進位至 0.7（避免高估 CrCl）。\\n'+REF.CG,\n  'SCr (mg/dL)':'Cockcroft-Gault 使用，用於族群 Ke 與預測濃度比對。\\nSCr <0.7 mg/dL 時會提示可考慮進位至 0.7。\\n'+REF.CG,\n  'Actual body weight':'族群 Vd 使用實際體重。\\nCrCl 用體重：BMI <25 用實際體重；BMI ≥25 用 AdjBW = IBW + 0.4×(ABW − IBW)。',\n  'Actual body weight (kg)':'族群 Vd 使用實際體重。\\nCrCl 用體重：BMI <25 用實際體重；BMI ≥25 用 AdjBW = IBW + 0.4×(ABW − IBW)。',\n  'AUC₂₄':'目標 AUC₂₄/MIC 400–600 mg·hr/L（假設 MIC = 1 mg/L）。\\n2020 共識的建議對象為成人「嚴重 MRSA 感染」：菌血症、心內膜炎、骨髓炎、腦膜炎、肺炎、嚴重皮膚軟組織感染等。非嚴重感染證據不足，共識未作建議。\\n'+REF.CON,\n  'Infusion rate':'留白＝自動：≤2000 mg 輸注 2 hr；2001–2500 mg 2.5 hr；2501–3000 mg 3 hr；>3000 mg 以 1000 mg/hr。\\n填入數值時，本頁所有劑量（目前、建議、自訂、比較）都使用此速率。',\n  '藥動模擬圖':'以本頁 Ke、Vd 模擬一室模式間歇輸注的濃度曲線。Initial Dosing 含負荷劑量；濃度追蹤頁自穩態劑量起算。綠帶為 trough 目標範圍。',\n};\n/* 結果表欄位 */\nconst RTIPS={\n  'AUC₂₄':'τ ≤24 hr：每日劑量 ÷ CL。\\nτ >24 hr：給藥後 0–24 hr（輸注期梯形 + 排除期對數積分）。',\n};\nconst info=t=>t?`<span class=\"i\" data-tip=\"${t.replace(/\"/g,'&quot;')}\">i<\/span>`:'';\nfunction addTips(){\n  document.querySelectorAll('label,h2,h3').forEach(el=>{\n    if(el.querySelector('.i')||el.closest('.radios')) return;\n    const n=el.childNodes[0]; if(!n||n.nodeType!==3) return;\n    const k=n.textContent.trim(); if(TIPS[k]) n.after(document.createRange().createContextualFragment(info(TIPS[k])));\n  });\n}\n(function(){\n  const tip=document.getElementById('tip'); let pinned=null;\n  const show=el=>{ tip.textContent=el.dataset.tip; tip.style.display='block';\n    const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;\n    let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8), y=r.top-h-8; if(y<8) y=r.bottom+8;\n    tip.style.left=x+'px'; tip.style.top=y+'px'; };\n  const hide=()=>{ tip.style.display='none'; };\n  document.addEventListener('mouseover',e=>{const el=e.target.closest('.i'); if(el) show(el);});\n  document.addEventListener('mouseout',e=>{ if(e.target.closest('.i')&&!pinned) hide(); });\n  document.addEventListener('click',e=>{const el=e.target.closest('.i');\n    if(pinned){pinned.classList.remove('on');} if(el&&el!==pinned){pinned=el;el.classList.add('on');show(el);} else {pinned=null;hide();}});\n  addEventListener('scroll',()=>{ if(!pinned) hide(); else show(pinned); },true);\n})();\n\nlet curPage='init';\ndocument.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));\n  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); curPage=b.dataset.p; $('page-'+curPage).classList.add('on');\n  run();\n});\n\nfunction tbl(el,rows){\n  $(el).innerHTML=!rows.length?'':'<tr><th>項目<\/th><th>數值<\/th><th>單位<\/th><\/tr>'+\n    rows.map(([k,v,u])=> (typeof k==='string'&&k.startsWith('§'))\n      ? `<tr class=\"sec\"><td colspan=\"3\">${k.slice(1)}<\/td><\/tr>`\n      : `<tr><td>${k}${info(RTIPS[k])}<\/td><td class=\"v\">${v}<\/td><td style=\"color:var(--muted)\">${u||''}<\/td><\/tr>`).join('');\n}\nfunction flagBox(v,lo,hi,nm,un,d){\n  if(!isFinite(v)) return '';\n  let c='f-ok',t=`${nm} 在目標範圍 ${lo}–${hi}`;\n  if(v<lo){c='f-warn';t=`${nm} 低於 ${lo}`;} else if(v>hi){c='f-bad';t=`${nm} 高於 ${hi}`;}\n  return `<div class=\"flag ${c}\">${t}（${r(v,d)} ${un}）<\/div>`;\n}\n/* Initial：依 Settings 目標；TDM 頁：trough 10–20 */\nfunction flagHTML(ctx,auc,trough,prefix=''){\n  const g=goal(ctx);\n  return flagBox(auc,400,600,prefix+'AUC₂₄','mg·hr/L',0)+flagBox(trough,g.lo,g.hi,prefix+'Trough','mcg/mL',1);\n}\nfunction alerts(el,list){$(el).innerHTML=list.filter(Boolean).map(x=>`<li>${x}<\/li>`).join('');}\n\n/* ===== 基礎參數（T7-T18, W11-W14, ZE25, E26, T35, E28）；p='' Initial、p='t_' Trough 頁 ===== */\n/* 範圍檢查（VancoPK validators：SCr 0.5–10 mg/dL；Height 54–85 inch / 137.16–215.9 cm；Weight 29–275 kg / 64–606 lbs） */\nconst RANGE={\n  scr:(v)=> (v>=0.5&&v<=10) ? '' : 'SCr should be between 0.5 and 10 mg/dL',\n  ht:(v,p)=> ($(p+'uHt')&&$(p+'uHt').value==='inch')\n      ? ((v>=54&&v<=85) ? '' : 'Height should be between 54 and 85 inch')\n      : ((v>=137.16&&v<=215.9) ? '' : 'Height should be between 138 and 215 cm'),\n  wt:(v,p)=> ($(p+'uWt')&&$(p+'uWt').value==='lbs')\n      ? ((v>=64&&v<=606) ? '' : 'Weight should be between 64 and 606 lbs')\n      : ((v>=29&&v<=275) ? '' : 'Weight should be between 29 and 275 kg'),\n};\nfunction fieldErr(p,k){\n  const el=$(p+k); if(!el||String(el.value).trim()==='') return '';\n  const v=parseFloat(el.value); if(!isFinite(v)) return 'Error: please enter valid number';\n  return RANGE[k](v,p);\n}\nfunction showRangeErr(){\n  ['','t_'].forEach(p=>['scr','ht','wt'].forEach(k=>{\n    const el=$(p+k); if(!el) return;\n    const cell=el.closest('.grid > div')||el.parentNode;\n    let d=document.getElementById('rerr_'+p+k);\n    if(!d){ d=document.createElement('div'); d.className='err'; d.id='rerr_'+p+k; d.style.marginTop='4px'; cell.appendChild(d); }\n    const m=fieldErr(p,k); d.textContent=m; el.style.borderColor=m?'var(--bad)':'';\n  }));\n}\ndocument.addEventListener('input',showRangeErr); document.addEventListener('change',showRangeErr);\nfunction patientOK(p){\n  return ['age','scr','ht','wt'].every(id=>isFinite(num(p+id))&&num(p+id)>0)\n      && ['scr','ht','wt'].every(k=>!fieldErr(p,k));\n}\nfunction base(p=''){\n  const g=id=>$(p+id);\n  const age=num(p+'age');\n  const scrIn = (g('uScr')&&g('uScr').value!=='mg/dL') ? num(p+'scr')/88.4 : num(p+'scr');\n  const htIn  = (g('uHt')&&g('uHt').value==='inch')    ? num(p+'ht')        : num(p+'ht')/2.54;\n  const wt    = (g('uWt')&&g('uWt').value==='lbs')     ? num(p+'wt')/2.2046 : num(p+'wt');\n  const sex=document.querySelector(`input[name=${p}sex]:checked`).value;\n  const htM=htIn*2.54/100, bmi=wt/(htM*htM);\n  const idmsOn = document.querySelector(`input[name=${p}idms]:checked`).value==='1';\n  const scr=idmsOn? scrIn*num(p+'slope')+num(p+'yint') : scrIn;\n  const ibw0=(sex==='M'?50:45.5)+2.3*(htIn-60);\n  const ibw=ibw0*(g('amp')?parseFloat(g('amp').value):1);\n  const w11 = bmi<25 ? wt : ibw+0.4*(wt-ibw);\n  const w13 = sex==='M'?1:0.85;\n  const cap = age<40?200:age<50?185:age<60?170:age<70?155:age<80?140:age<90?125:110;\n  const crcl = Math.min(((140-age)*w13*w11)/(72*scr), cap);\n  const CLv = ((0.75*crcl)+4)*0.06;\n  const Vd = 0.29*age + 0.33*wt + 11;\n  const Ke = Math.max(Math.min(CLv/Vd,0.2),0.008);\n  return {age,scr,scrIn,htIn,wt,sex,bmi,ibw,w11,crcl,CLv,Vd,Ke,half:0.693/Ke,idmsOn,capped:crcl>=cap-1e-9};\n}\n\n/* 輸注速率：各頁獨立欄位，留白 → 自動 */\nconst RATEID={init:'rate',sst:'s_rate',pt:'q_rate'};\nlet RID='rate';\nconst useRate=ctx=>{RID=RATEID[ctx];};\nfunction autoTinf(dose){ if(dose<=2000) return 2; if(dose<=2500) return 2.5; if(dose<=3000) return 3; return dose/1000; }\nfunction effRate(dose){ const v=parseFloat($(RID).value); return (isFinite(v)&&v>0)? v : dose/autoTinf(dose); }\nconst rateAuto=()=>!(parseFloat($(RID).value)>0);\nconst Tinf=dose=>dose/effRate(dose);\n\nfunction ss(dose,tau,Ke,Vd){\n  const ti=Tinf(dose);\n  const Cmax=(dose*(1-EXP(-Ke*ti)))/(Ke*Vd*ti*(1-EXP(-Ke*tau)));\n  return {ti,Cmax,Cmin:Cmax*EXP(-Ke*(tau-ti))};\n}\nfunction auc24(dose,tau,Ke,Vd,CLv){\n  const {ti,Cmax,Cmin}=ss(dose,tau,Ke,Vd);\n  if(tau<=24) return (dose/tau)*24/CLv;\n  const C24=Cmax*EXP(-Ke*(24-ti));\n  return (Cmax+Cmin)/2*ti + ((Cmax-C24)*(24-ti))/LN(Cmax/C24);\n}\nfunction aucMin(dose,tau,Ke,Vd){\n  if(![36,48,72].includes(tau)) return NaN;\n  const {ti,Cmax}=ss(dose,tau,Ke,Vd);\n  const C=x=>Cmax*EXP(-Ke*(x-ti));\n  const [a,b]= tau===36?[12,36] : tau===48?[24,48] : [48,72];\n  return (C(a)-C(b))*24/LN(C(a)/C(b));\n}\n\n/* ---- Initial：目標 AUC 400-600 或 trough 範圍（原程式邏輯） ---- */\nconst goalRange=()=>goal('init').range;\nconst isAUC=()=>goal('init').type==='auc';\nconst troughLim=()=>{const g=goal('init'); return [g.lo,g.hi];};\nconst troughCoef=Vd=>({'15-20':[37,30],'14-19':[36,29],'13-18':[35,28],\n  '12-17':[34,27],'11-16':[33,26],'10-15':[32,25]}[goalRange()])[Vd<=75?0:1];\nfunction intervalByTrough(Ke,Vd){\n  const base=(Vd<=75?LN(35/15):LN(30/15))/Ke, lad=[8,12,18,24,36,48,72];\n  if(base<=8)return 8; if(base>=72)return 72;\n  for(let i=0;i<lad.length-1;i++) if(base>=lad[i]&&base<=lad[i+1])\n    return Math.abs(base-lad[i])<Math.abs(base-lad[i+1])?lad[i]:lad[i+1];\n  return 72;\n}\nfunction doseByTrough(tau,Ke,Vd){\n  const T24=MROUND(troughCoef(Vd)*Vd*(1-EXP(-Ke*tau)),250);\n  const {Cmin}=ss(T24,tau,Ke,Vd); const [lo,hi]=troughLim();\n  return Math.min((Cmin>=lo&&Cmin<=hi)?T24:(Cmin<lo?T24+250:T24-250),2000);\n}\nfunction pickInterval(Z,Vd){\n  if(Z<204) return 72; if(Z<410) return 48; if(Z<1312.5) return 24;\n  if(Z<1562.5) return Vd<30?8:(Vd<55?12:24);\n  if(Z<1812.5) return Vd>=60?24:12;\n  if(Z<2675) return 12; if(Z<3125) return Vd<55?8:12; if(Z<3550) return Vd>=65?12:8;\n  return 8;\n}\nfunction pickDose(targetDaily,tau,CLv){\n  const raw=MROUND(targetDaily/(24/tau),250);\n  const pred=(raw*(24/tau))/CLv;\n  const d=(pred>=400&&pred<=600)?raw:(pred<400?raw+250:raw-250);\n  return Math.max(Math.min(d,2000),500);\n}\nfunction planInit(Ke,Vd,CLv){\n  if(isAUC()){const T=550*CLv, tau=pickInterval(T,Vd); return {tau,dose:pickDose(T,tau,CLv)};}\n  const tau=intervalByTrough(Ke,Vd); return {tau,dose:doseByTrough(tau,Ke,Vd)};\n}\n\n/* ---- 建議劑量：先符合 AUC 400–600，再以 trough 落在目標範圍、最接近中點者優先 ---- */\nfunction suggest(pk,ctx,cap){\n  const g=goal(ctx), all=[];\n  for(const tau of [8,12,24,36,48]) for(let dose=500;dose<=cap;dose+=250){\n    const n=ss(dose,tau,pk.Ke,pk.Vd), auc=auc24(dose,tau,pk.Ke,pk.Vd,pk.CL), daily=dose*24/tau;\n    if(n.Cmax>40||daily>4000) continue;\n    all.push({dose,tau,auc,Cmin:n.Cmin,\n      aucOK:auc>=400&&auc<=600, trOK:n.Cmin>=g.lo&&n.Cmin<=g.hi,\n      trD:n.Cmin<g.lo?g.lo-n.Cmin:(n.Cmin>g.hi?n.Cmin-g.hi:0)});\n  }\n  if(!all.length) return {dose:500,tau:24};\n  const okA=all.filter(x=>x.aucOK);\n  const pool=okA.length?okA:all;\n  pool.sort((a,b)=> okA.length\n      ? (a.trD-b.trD) || (Math.abs(a.Cmin-g.mid)-Math.abs(b.Cmin-g.mid)) || (Math.abs(a.auc-500)-Math.abs(b.auc-500))\n      : Math.abs(a.auc-500)-Math.abs(b.auc-500));\n  return {dose:pool[0].dose,tau:pool[0].tau};\n}\n\n/* ---- TDM 頁：自動找出 trough 10–20 的改藥方案 ---- */\nfunction troughCandidates(pk,ctx){\n  const {Ke,Vd,CL}=pk, out=[]; const {lo:TLO,hi:THI,mid:TMID}=tgt(ctx);\n  for(const tau of [8,12,24,36,48]){\n    let d=1000;\n    for(let i=0;i<4;i++){ const c=ss(d,tau,Ke,Vd).Cmin; d=d*TMID/c; }\n    let dose=Math.min(Math.max(MROUND(d,250),500),3000);\n    let n=ss(dose,tau,Ke,Vd);\n    if(n.Cmin>THI&&dose>500){dose-=250;n=ss(dose,tau,Ke,Vd);}\n    else if(n.Cmin<TLO&&dose<3000){dose+=250;n=ss(dose,tau,Ke,Vd);}\n    const daily=dose*24/tau;\n    out.push({dose,tau,...n,daily,auc:auc24(dose,tau,Ke,Vd,CL),\n      ok:n.Cmin>=TLO&&n.Cmin<=THI&&n.Cmax<=40&&daily<=4000});\n  }\n  const pref=LN((Vd<=75?35:30)/15)/Ke;\n  const okList=out.filter(x=>x.ok);\n  const rec=(okList.length?okList:out).slice().sort((a,b)=>\n    okList.length? Math.abs(a.tau-pref)-Math.abs(b.tau-pref) : Math.abs(a.Cmin-TMID)-Math.abs(b.Cmin-TMID))[0];\n  return {list:out,rec};\n}\nfunction renderCandidates(ctx,el,cand){\n  $(el).innerHTML='<tr><th>方案<\/th><th>每日總量<\/th><th>Peak_ss<\/th><th>Trough_ss<\/th><th>AUC₂₄<\/th><th>評估<\/th><th><\/th><\/tr>'+\n    cand.list.map(x=>{\n      const isRec=x===cand.rec;\n      const tag=x.ok?'<span class=\"tag t-ok\">符合<\/span>'\n        : x.Cmax>40?'<span class=\"tag t-bad\">Peak >40<\/span>'\n        : x.daily>4000?'<span class=\"tag t-bad\">日劑量 >4 g<\/span>'\n        : '<span class=\"tag t-bad\">未達目標<\/span>';\n      return `<tr class=\"${isRec&&x.ok?'best':(x.ok?'':'bad')}\"><td class=\"v\">${x.dose} mg q${x.tau}h<\/td>`+\n        `<td class=\"v\">${r(x.daily,0)} mg<\/td><td class=\"v\">${r(x.Cmax,1)}<\/td><td class=\"v\">${r(x.Cmin,1)}<\/td>`+\n        `<td class=\"v\">${r(x.auc,0)}<\/td><td>${tag}<\/td>`+\n        `<td><button class=\"ghost sm\" onclick=\"useCand('${ctx}',${x.dose},${x.tau})\">採用<\/button><\/td><\/tr>`;\n    }).join('');\n}\nfunction useCand(ctx,dose,tau){\n  const [di,ti]=IN[ctx]; $(di).value=dose; $(ti).value=tau; S[ctx].td=S[ctx].tt=true;\n  addCompare(ctx); run();\n}\n\n/* ===== 狀態 ===== */\nconst IN={init:['doseAlt','tau','recNote'],sst:['s_ndose','s_ntau','s_rec'],pt:['q_ndose','q_ntau','q_rec']};\nconst newState=()=>({pk:null,res:null,err:'',list:[],td:false,tt:false,auto:false});\nlet S={init:newState(),sst:newState(),pt:newState()};\nlet computed=false;\n\nfunction syncRegimen(ctx,rec){\n  const [di,ti,ri]=IN[ctx], st=S[ctx];\n  if(!st.td) $(di).value=rec.dose;\n  if(!st.tt) $(ti).value=rec.tau;\n  $(ri).innerHTML=`系統建議 <b>${rec.dose} mg q${rec.tau}h<\/b>`\n    +((st.td||st.tt)?'　<span style=\"color:var(--warn)\">目前為手動輸入值<\/span>':'');\n  const dose=num(di)||rec.dose, tau=parseFloat($(ti).value)||rec.tau;\n  if(!st.auto){ st.auto=true; if(!st.list.some(x=>x.dose===dose&&x.tau===tau)) st.list.push({dose,tau}); }\n  return {dose,tau};\n}\nfunction adoptedRows(pk,dose,tau){\n  const {ti,Cmax,Cmin}=ss(dose,tau,pk.Ke,pk.Vd);\n  const a=auc24(dose,tau,pk.Ke,pk.Vd,pk.CL), am=aucMin(dose,tau,pk.Ke,pk.Vd);\n  const rows=[\n    ['採用方案',`${dose} mg q${tau}h`,''],\n    ['每日總劑量',r(dose*24/tau,0),'mg/day'],\n    ['輸注速率',r(effRate(dose),0),'mg/hr'],\n    ['輸注時間',r(ti,2),'hr'],\n    ['Peak_ss',r(Cmax,1),'mcg/mL'],\n    ['Trough_ss',r(Cmin,1),'mcg/mL'],\n    ['AUC₂₄',r(a,0),'mg·hr/L'],\n  ];\n  if(isFinite(am)) rows.push(['AUC₂₄ min',r(am,0),'mg·hr/L']);\n  return {rows,auc:a,Cmin,Cmax};\n}\n\n/* Ke 疊代（T65 → T85） */\nfunction solveKeSST(dose,tau,C,t,Vd,ti){\n  const tr=K=>(dose/(ti*K*Vd)*(1-EXP(-K*ti)))*EXP(-K*(t-ti))/(1-EXP(-K*tau));\n  const K0=LN(((dose/Vd)+C)/C)/((t+tau)/2);\n  const t66=tr(K0), t67=(t66/C)*K0;\n  const t68=tr(t67), t69=(t68/C)*t67;\n  const t71=(t67+t69)/2, t72=tr(t71), t73=(t72/C)*t71;\n  const t75=(t71+t73)/2, t76=tr(t75), t77=(t76/C)*t75;\n  const t79=(t75+t77)/2, t80=tr(t79), t81=(t80/C)*t79;\n  const t83=(t79+t81)/2;\n  return (t83+t81)/2;\n}\n/* 時間解析：接受 8:30、08:30、0830、830 */\nfunction parseHM(s){\n  s=(s||'').trim(); let m=s.match(/^(\\d{1,2}):(\\d{2})$/)||s.match(/^(\\d{1,2})(\\d{2})$/);\n  if(!m) return null; const H=+m[1], M=+m[2];\n  return (H<24&&M<60)?{H,M}:null;\n}\nfunction dtHours(d1,t1,d2,t2){\n  const a=parseHM(t1), b=parseHM(t2); if(!d1||!d2||!a||!b) return NaN;\n  const A=new Date(d1+'T00:00'), B=new Date(d2+'T00:00');\n  A.setHours(a.H,a.M); B.setHours(b.H,b.M);\n  return (B-A)/3600000;\n}\n\nfunction run(){\n  if(computed) runInit();\n  liveSST(); livePT(); showSST(); showPT();\n  ['init','sst','pt'].forEach(renderCompare);\n}\n\n/* ===================== Initial Dosing ===================== */\nfunction runInit(){\n  useRate('init');\n  if(!patientOK('')){ $('pkNote').innerHTML='<span style=\"color:var(--warn)\">請先完整填寫病人資料，並修正超出範圍的數值<\/span>'; showRangeErr(); S.init.pk=null; return; }\n  const b=base('');\n  tbl('pk',[['CrCl',r(b.crcl,0),'mL/min'],['CLvanco',r(b.CLv,2),'L/hr'],['Vd',r(b.Vd,0),'L'],\n    ['Ke',r(b.Ke,4),'hr⁻¹'],['Half-life',r(b.half,1),'hrs']]);\n  $('pkNote').textContent=`IBW ${r(b.ibw,1)} kg・BMI ${r(b.bmi,1)}・CrCl 用體重 ${r(b.w11,1)} kg`+(b.capped?'・CrCl 已達年齡上限':'');\n  $('slope').disabled=!b.idmsOn; $('yint').disabled=!b.idmsOn;\n\n  const pk={Ke:b.Ke,Vd:b.Vd,CL:b.CLv}; S.init.pk=pk;\n  const {dose,tau}=syncRegimen('init',suggest(pk,'init',2000));\n  const ad=adoptedRows(pk,dose,tau);\n  const LD=parseFloat($('ld').value), gap=num('ldgap');\n  let ldRows=[], peakLD=NaN;\n  if(LD>0){\n    const tiLD=Tinf(LD);\n    peakLD=(LD*(1-EXP(-b.Ke*tiLD)))/(tiLD*b.Ke*(b.Vd*1.25));\n    ldRows=[['LD Peak',r(peakLD,1),'mcg/mL'],['維持劑量開始時濃度',r(peakLD*EXP(-b.Ke*(gap-tiLD)),1),'mcg/mL']];\n  }\n  tbl('tInit',[...ldRows,...ad.rows]);\n  $('fInit').innerHTML=flagHTML('init',ad.auc,ad.Cmin);\n  $('rateNote').innerHTML = rateAuto()? `自動 ${r(effRate(dose),0)} mg/hr・輸注 ${r(Tinf(dose),1)} hr` : `輸注 ${r(Tinf(dose),1)} hr`;\n  alerts('aInit',[\n    b.scrIn<0.7?'SCr <0.7 mg/dL，建議進位至 0.7。':'',\n    tau>=36?'給藥間隔 >24 小時時，間隔前 24 小時的 AUC 高於後 24 小時。':'',\n    (tau===8 && dose/b.wt>18)?'劑量 >18 mg/kg q8h，考慮降低維持劑量。':'',\n    dose*(24/tau)>4000?'日劑量 >4 g，通常保留給 <55 歲、>110 kg、CrCl >150 的病人。':'',\n    (LD>0&&peakLD>40)?'負荷劑量可能造成 Peak >40 mcg/mL，考慮降低。':'',\n    ad.auc>700?'AUC₂₄ 可能 >700，考慮降低每日總劑量。':'',\n  ]);\n}\n\n/* 建議劑量區塊（TDM 頁共用） */\nfunction runSuggest(ctx,pk,candEl,adoptEl,flagEl){\n  const {dose,tau}=syncRegimen(ctx,suggest(pk,ctx,3000));\n  const ad=adoptedRows(pk,dose,tau);\n  tbl(adoptEl,ad.rows);\n  $(flagEl).innerHTML=flagHTML(ctx,ad.auc,ad.Cmin,'建議劑量 ');\n  return {dose,tau,ad};\n}\nfunction clearSuggest(p){ [p+'_adopt',p+'_rec'].forEach(id=>$(id).innerHTML=''); }\n\n/* ===================== Steady-State Trough ===================== */\n/* 輸入時只做即時顯示（不計算） */\nfunction liveSST(){\n  const mode=$('s_mode').value;\n  $('s_vdBox').style.display = mode==='vd'?'':'none';\n  $('s_keBox').style.display = mode==='ke'?'':'none';\n  $('t_slope').disabled=$('t_yint').disabled=document.querySelector('input[name=t_idms]:checked').value!=='1';\n  const t=dtHours($('s_d1').value,$('s_t1').value,$('s_d2').value,$('s_t2').value);\n  $('s_t').value = isFinite(t)? r(t,2) : '';\n  return t;\n}\n/* 按「計算」才執行 */\nfunction calcSST(){\n  useRate('sst');\n  Object.assign(S.sst,{td:false,tt:false,auto:false,list:[]});\n  const mode=$('s_mode').value, t=liveSST();\n  const clear=msg=>{ S.sst.pk=null; S.sst.res=null; S.sst.err=msg; run(); };\n\n  const pOK=patientOK('t_'), b=pOK?base('t_'):null;\n  const dose=num('s_dose'), tau=parseFloat($('s_tau').value), C=num('s_c');\n  if(mode==='est' && !pOK){ showRangeErr(); return clear('請輸入病人資料，並修正超出範圍的數值。'); }\n  if(!(dose>0&&C>0)) return clear('請輸入目前劑量與量測濃度。');\n  if(!isFinite(t)) return clear('請輸入給藥開始與抽血的日期、時間（HH:MM）。');\n  if(t<=0) return clear('抽血時間必須晚於給藥開始。');\n  if(mode==='vd' && !(num('s_vd')>0)) return clear('請輸入 Vd。');\n  if(mode==='ke' && !(num('s_ke')>0)) return clear('請輸入 Ke。');\n  const ti=Tinf(dose);\n  if(t<0.5+ti) return clear(`抽血時間需 ≥ ${r(0.5+ti,2)} hr（輸注結束後 30 分鐘）。`);\n  $('s_err').textContent='';\n\n  let Vd,Ke;\n  if(mode==='ke'){ Ke=num('s_ke'); Vd=(dose*EXP(-Ke*(t-ti))*(1-EXP(-Ke*ti)))/(C*ti*Ke*(1-EXP(-Ke*tau))); }\n  else { Vd = mode==='vd'?num('s_vd'):b.Vd; Ke=solveKeSST(dose,tau,C,t,Vd,ti); }\n  if(!(isFinite(Ke)&&Ke>0&&isFinite(Vd)&&Vd>0)) return clear('無解，請檢查輸入資料。');\n\n  const CL=Vd*Ke, pk={Ke,Vd,CL};\n  const AUC=((dose/tau)*24)/CL;\n  const trTau = t<=tau ? C*EXP(-Ke*(tau-t)) : C/EXP(-Ke*(t-tau));\n  let popAtT=NaN;\n  if(b){ const pop=ss(dose,tau,b.Ke,b.Vd); popAtT=pop.Cmax*EXP(-b.Ke*(t-pop.ti)); }\n  S.sst.pk=pk; S.sst.err='';\n  S.sst.res={AUC,trTau,\n    rows:[['Vd',r(Vd,1),'L'],['Ke',r(Ke,4),'hr⁻¹'],['Half-life',r(0.693/Ke,1),'hr'],['CLvanco',r(CL,2),'L/hr'],\n      ['推算谷值',r(trTau,1),'mcg/mL'],['目前 AUC₂₄',r(AUC,0),'mg·hr/L']],\n    alerts:[\n      mode==='est'?'使用族群 Ke 與 Vd，AUC₂₄ 僅為估計值。':'',\n      AUC>700?'目前 AUC₂₄ 可能 >700，考慮降低每日總劑量。':'',\n      (b&&b.scrIn<0.7)?'SCr <0.7 mg/dL，建議進位至 0.7。':'',\n      (isFinite(popAtT)&&Math.abs(C-popAtT)>10)?`量測濃度與族群預測值（${r(popAtT,1)} mcg/mL）相差 >10，請確認病人資料。`:'',\n    ]};\n  run();\n}\n/* 顯示結果：建議劑量、自訂劑量依目前 Goal／輸入即時更新 */\nfunction showSST(){\n  useRate('sst');\n  const st=S.sst, res=st.res;\n  $('s_err').textContent=st.err||'';\n  if(!res){ ['tSST','fSST','aSST','fSSTn'].forEach(id=>$(id).innerHTML=''); clearSuggest('s'); return; }\n  tbl('tSST',res.rows);\n  $('fSST').innerHTML=flagHTML('sst',res.AUC,res.trTau,'目前 ');\n  const sg=runSuggest('sst',st.pk,'s_cand','s_adopt','fSSTn');\n  alerts('aSST',[...res.alerts, sg.tau>=36?'給藥間隔 >24 小時時，間隔前 24 小時的 AUC 高於後 24 小時。':'']);\n}\n\n/* ===================== Steady-State Peak & Trough ===================== */\nfunction livePT(){\n  const tp=dtHours($('q_d0').value,$('q_h0').value,$('q_d1').value,$('q_h1').value);\n  const ttRaw=dtHours($('q_d3').value,$('q_h3').value,$('q_d2').value,$('q_h2').value);\n  $('q_tpk').value=isFinite(tp)?r(tp,2):'';\n  $('q_ttr').value=isFinite(ttRaw)?(ttRaw<0?`${r(ttRaw,2)}（給藥前）`:r(ttRaw,2)):'';\n  return {tp,ttRaw};\n}\nfunction calcPT(){\n  useRate('pt');\n  Object.assign(S.pt,{td:false,tt:false,auto:false,list:[]});\n  const clear=msg=>{ S.pt.pk=null; S.pt.res=null; S.pt.err=msg; run(); };\n  const dose=num('q_dose'), tau=parseFloat($('q_tau').value),\n        Cp=num('q_pk'), Ct=num('q_tr');\n  const {tp,ttRaw}=livePT();\n  /* 穩態下，給藥前抽的 trough 等同上一間隔末：t + τ */\n  const tt = ttRaw<0 ? ttRaw+tau : ttRaw;\n  if(!(dose>0&&Cp>0&&Ct>0)) return clear('請輸入劑量與 Peak、Trough 濃度。');\n  if(!isFinite(tp)||!isFinite(tt)) return clear('請輸入 Peak、Trough 的給藥開始與抽血日期、時間（HH:MM）。');\n  if(tt<0) return clear('Trough 抽血距給藥開始超過一個間隔，請確認時間。');\n  if(tp<=0) return clear('Peak 抽血時間必須晚於給藥開始。');\n  const ti=Tinf(dose);\n  if(tp<0.5+ti) return clear(`Peak 抽血時間需 ≥ ${r(0.5+ti,2)} hr（輸注結束後 30 分鐘）。`);\n  if(tt<=tp) return clear('Trough 抽血時間必須晚於 Peak。');\n  if(Ct>=Cp) return clear('Trough 濃度必須低於 Peak。');\n  $('q_err').textContent='';\n\n  const dt=tt-tp, Ke=LN(Cp/Ct)/dt;\n  const Cmax=Cp/EXP(-Ke*(tp-ti));\n  const Cmin= tt<=tau ? Ct*EXP(-Ke*(tau-tt)) : Ct/EXP(-Ke*(tt-tau));\n  const Vd=dose*(1-EXP(-Ke*ti))/(Ke*ti*(Cmax-Cmin*EXP(-Ke*ti)));\n  if(!(isFinite(Vd)&&Vd>0)) return clear('無解，請檢查輸入資料。');\n  const CL=Ke*Vd, pk={Ke,Vd,CL};\n  const AUC=((dose/tau)*24)/CL, half=0.693/Ke;\n  S.pt.pk=pk; S.pt.err='';\n  S.pt.res={AUC,trTau:Cmin,\n    rows:[['Ke',r(Ke,4),'hr⁻¹'],['Half-life',r(half,1),'hr'],['Cmax',r(Cmax,1),'mcg/mL'],['Cmin',r(Cmin,1),'mcg/mL'],\n      ['Vd',r(Vd,1),'L'],['CLvanco',r(CL,2),'L/hr'],['目前 AUC₂₄',r(AUC,0),'mg·hr/L']],\n    alerts:[\n      dt<0.8*half?'兩點抽血時間可能太接近，Ke 未必準確。':'',\n      AUC>700?'目前 AUC₂₄ 可能 >700，考慮降低每日總劑量。':'',\n    ]};\n  run();\n}\nfunction showPT(){\n  useRate('pt');\n  const st=S.pt, res=st.res;\n  $('q_err').textContent=st.err||'';\n  if(!res){ ['tPT','fPT','aPT','fPTn'].forEach(id=>$(id).innerHTML=''); clearSuggest('q'); return; }\n  tbl('tPT',res.rows);\n  $('fPT').innerHTML=flagHTML('pt',res.AUC,res.trTau,'目前 ');\n  const sg=runSuggest('pt',st.pk,'q_cand','q_adopt','fPTn');\n  alerts('aPT',[...res.alerts, sg.tau>=36?'給藥間隔 >24 小時時，間隔前 24 小時的 AUC 高於後 24 小時。':'']);\n}\n\n/* ===== 重設 ===== */\nconst PAGE_IDS={\n  init:['age','scr','ht','wt','rate','doseAlt','ldgap'],\n  sst:['t_age','t_scr','t_ht','t_wt','s_vd','s_ke','s_dose','s_rate','s_c','s_t1','s_t2','s_t','s_ndose','s_ntau'],\n  pt:['q_dose','q_rate','q_pk','q_tr','q_h0','q_h1','q_h2','q_h3','q_tpk','q_ttr','q_ndose','q_ntau'],\n};\nconst today=()=>{const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10);};\nfunction clearPage(ctx){\n  S[ctx]=newState();\n  PAGE_IDS[ctx].forEach(id=>{ $(id).value=''; });\n  if(ctx==='init'){\n    computed=false; $('ld').value='0';\n    ['pk','tInit','pkNote','recNote','rateNote','fInit','aInit'].forEach(id=>$(id).innerHTML='');\n  }\n  if(ctx==='sst'){ $('s_mode').value='est'; $('t_amp').value='1'; ['s_d1','s_d2'].forEach(id=>$(id).value=today()); }\n  if(ctx==='pt'){ ['q_d0','q_d1','q_d2','q_d3'].forEach(id=>$(id).value=today()); }\n  run();\n  if(ctx==='init') renderCompare('init');\n}\nfunction calc(){\n  computed=true; Object.assign(S.init,{td:false,tt:false,auto:false});\n  run();\n}\n\n/* ===== 產出建議（罐頭訊息）＋ 個人模板 ===== */\nlet RPT_CTX='init';\n/* 部署 Apps Script 後，把網址填在這裡，所有人就不用再自行貼上 */\nconst GAS_URL_DEFAULT='https://script.google.com/macros/s/AKfycbwYfsV7pkOU27cfJ0Sp3EjUmh-is30njPv50YYefCNxLQK9N_XgLzaeIiFoWUS1zlD6Mg/exec';\nconst n0=x=>isFinite(x)?Math.round(x).toLocaleString('en-US'):'';\nconst BL='      ';   /* 待填處：以空格呈現 */\n\n/* ---------- 可用欄位 ---------- */\nconst TOKENS=[\n  ['date','檢驗日期'],['age','年齡'],['sex','性別 M/F'],['ht','身高 cm'],['bw','體重 kg'],['bmi','BMI'],['ibw','IBW kg'],\n  ['scr','SCr'],['crcl','CrCl'],['levels','目前劑量與濃度（TDM 頁才有，含換行）'],\n  ['vd','Vd'],['vdkg','Vd L/kg'],['ke','Ke'],['half','t½'],['cl','CL'],['target_trough','目標 trough 範圍'],\n  ['regimen','建議方案整句（含 loading、Adjust/Continue）'],['ld','負荷劑量 mg'],['dose','維持劑量 mg'],['tau','間隔 h'],\n  ['tinf','輸注時間 hr'],['daily','每日劑量 mg'],['mgkg','mg/kg/dose'],\n  ['est_peak','預估 Peak'],['est_trough','預估 Trough'],['est_auc','預估 AUC₂₄'],\n  ['cur_dose','目前劑量 mg'],['cur_tau','目前間隔 h'],['cur_trough','目前推算 trough'],['cur_auc','目前 AUC₂₄'],\n];\nconst DEFAULT_TPL=`Impression & Assessment\n1.{age} y/o {sex}, Ht {ht} cm, BW {bw} kg (BMI {bmi}), admitted due to ${BL}\n2.{date} SCr {scr} mg/dL, CrCl {crcl} mL/min{levels}\n3.Vancomycin PK: Vd {vd} L, Ke {ke} hr⁻¹, t½ {half} hr, CL {cl} L/hr\n4.Target: AUC₂₄ 400–600 mg·hr/L, trough {target_trough} mcg/mL\n\nSuggestion\n1.{regimen}; estimated trough {est_trough} mcg/mL, AUC₂₄ {est_auc} mg·hr/L\n2.Follow trough at ${BL} on ${BL}`;\n\nfunction rptPatient(ctx){\n  const order = ctx==='init'?['']:['t_',''];\n  for(const p of order) if(patientOK(p)) return base(p);\n  return null;\n}\nfunction reportVars(ctx){\n  useRate(ctx);\n  if(ctx==='init' && !computed) run();\n  const st=S[ctx];\n  if(!st.pk) return null;\n  const pk=st.pk, b=rptPatient(ctx), g=goal(ctx);\n  const dose=num(IN[ctx][0]), tau=parseFloat($(IN[ctx][1]).value);\n  const s=ss(dose,tau,pk.Ke,pk.Vd), auc=auc24(dose,tau,pk.Ke,pk.Vd,pk.CL);\n  const V={};\n  V.date=($('ro_date').value||'').replace(/-/g,'/');\n  if(b) Object.assign(V,{age:n0(b.age),sex:b.sex,ht:r(b.htIn*2.54,1),bw:r(b.wt,1),bmi:r(b.bmi,1),ibw:r(b.ibw,1),\n                         scr:r(b.scrIn,2),crcl:r(b.crcl,0),vdkg:r(pk.Vd/b.wt,2),mgkg:r(dose/b.wt,1)});\n  Object.assign(V,{vd:r(pk.Vd,1),ke:r(pk.Ke,4),half:r(0.693/pk.Ke,1),cl:r(pk.CL,2),target_trough:`${g.lo}–${g.hi}`,\n    dose:n0(dose),tau:String(tau),tinf:r(s.ti,1),daily:n0(dose*24/tau),\n    est_peak:r(s.Cmax,1),est_trough:r(s.Cmin,1),est_auc:n0(auc),levels:''});\n  const reg=`${n0(dose)} mg IVD q${tau}h (infuse over ${r(s.ti,1)} hr)`;\n  if(ctx==='init'){\n    const LD=parseFloat($('ld').value);\n    V.ld = LD>0 ? n0(LD) : '';\n    V.regimen = LD>0 ? `Vancomycin loading dose ${n0(LD)} mg IVD ST, then ${reg}` : `Vancomycin ${reg}`;\n  }else if(st.res){\n    const cd=num(ctx==='sst'?'s_dose':'q_dose'), ct=parseFloat($(ctx==='sst'?'s_tau':'q_tau').value);\n    Object.assign(V,{cur_dose:n0(cd),cur_tau:String(ct),cur_trough:r(st.res.trTau,1),cur_auc:n0(st.res.AUC)});\n    V.regimen = (cd===dose&&ct===tau) ? `Continue vancomycin ${reg}` : `Adjust vancomycin to ${reg}`;\n    V.levels = ctx==='sst'\n      ? `\\n   Vancomycin ${n0(cd)} mg q${ct}h, level ${r(num('s_c'),1)} mcg/mL (drawn ${$('s_t').value||BL} hr after start of infusion)`\n        +`\\n   → estimated trough ${r(st.res.trTau,1)} mcg/mL, AUC₂₄ ${n0(st.res.AUC)} mg·hr/L`\n      : `\\n   Vancomycin ${n0(cd)} mg q${ct}h, peak ${r(num('q_pk'),1)} mcg/mL (${$('q_tpk').value||BL} hr after start), trough ${r(num('q_tr'),1)} mcg/mL`\n        +`\\n   → Cmax ${r(ss(cd,ct,pk.Ke,pk.Vd).Cmax,1)}, Cmin ${r(st.res.trTau,1)} mcg/mL, AUC₂₄ ${n0(st.res.AUC)} mg·hr/L`;\n  }\n  return V;\n}\nfunction fillTpl(tpl,V){\n  return tpl.replace(/\\{(\\w+)\\}/g,(m,k)=>{\n    if(!TOKENS.some(t=>t[0]===k)) return m;\n    const v=V[k];\n    return (v==null||v===''||v==='—') ? (k==='levels'?'':BL.slice(0,3)) : v;\n  });\n}\nfunction buildReport(ctx){\n  const V=reportVars(ctx);\n  if(!V) return '尚未完成計算。\\n請先填妥本頁資料並按「計算」，再產出建議。';\n  return fillTpl(curTpl().text,V);\n}\n\n/* ---------- 模板儲存：本機（含主程式代存）＋ Google 雲端 ---------- */\nconst TPL_KEY='vanco_tpl_v1';\nlet TPL={list:[],sel:0,gasUrl:'',email:'',ts:0};\nfunction tplLoad(){\n  let raw=null;\n  try{ raw=localStorage.getItem(TPL_KEY); }catch(e){}\n  if(!raw && window.__ABX_TPL) raw=window.__ABX_TPL;     // 內嵌於抗生素查詢系統時由主程式代存\n  try{ if(raw) TPL=Object.assign(TPL,JSON.parse(raw)); }catch(e){}\n  if(GAS_URL_DEFAULT) TPL.gasUrl=GAS_URL_DEFAULT;\n  if(!Array.isArray(TPL.list)) TPL.list=[];\n}\nfunction tplStoreLocal(){\n  const raw=JSON.stringify(TPL);\n  try{ localStorage.setItem(TPL_KEY,raw); }catch(e){}\n  try{ if(window.parent!==window) window.parent.postMessage({type:'vanco-tpl-store',data:raw},'*'); }catch(e){}\n}\nfunction curTpl(){\n  if(TPL.sel>0 && TPL.list[TPL.sel-1]) return TPL.list[TPL.sel-1];\n  return {name:'系統預設',text:DEFAULT_TPL};\n}\nfunction renderTplSel(){\n  $('ro_tpl').innerHTML=['<option value=\"0\">系統預設<\/option>',\n    ...TPL.list.map((t,i)=>`<option value=\"${i+1}\">${t.name.replace(/<\/g,'&lt;')}<\/option>`)].join('');\n  $('ro_tpl').value=String(TPL.sel);\n  $('ro_cloud').innerHTML = TPL.email\n    ? `☁ ${TPL.email.replace(/<\/g,'&lt;')}　<a href=\"#\" onclick=\"cloudSync('load');return false\">同步<\/a>・<a href=\"#\" onclick=\"cloudLogout();return false\">登出<\/a>`\n    : `<a href=\"#\" onclick=\"cloudSync('load');return false\">以 Google 登入，同步個人模板<\/a>`;\n}\nfunction pickTpl(){\n  TPL.sel=+$('ro_tpl').value; TPL.ts=Date.now(); tplStoreLocal(); regenReport();\n}\n\n/* ---------- 模板編輯 ---------- */\nlet EDIT_IDX=0;   // 0 = 新模板\nfunction openTplEditor(){\n  const t=curTpl(); EDIT_IDX=TPL.sel;\n  $('te_name').value = TPL.sel>0 ? t.name : '我的模板';\n  $('te_text').value = t.text;\n  $('te_del').style.display = TPL.sel>0 ? '' : 'none';\n  $('te_saveas').style.display = TPL.sel>0 ? '' : 'none';\n  $('te_save').textContent = TPL.sel>0 ? '儲存' : '儲存為新模板';\n  $('te_tokens').innerHTML = TOKENS.map(([k,d])=>`<button class=\"tok\" title=\"${d}\" onclick=\"insTok('${k}')\">{${k}}<small>${d}<\/small><\/button>`).join('');\n  $('rptView').style.display='none'; $('tplView').style.display='flex';\n}\nfunction closeTplEditor(){ $('tplView').style.display='none'; $('rptView').style.display='flex'; }\nfunction insTok(k){\n  const ta=$('te_text'), s=ta.selectionStart, e=ta.selectionEnd, v='{'+k+'}';\n  ta.value=ta.value.slice(0,s)+v+ta.value.slice(e); ta.focus(); ta.selectionStart=ta.selectionEnd=s+v.length;\n}\nfunction previewTpl(){\n  const V=reportVars(RPT_CTX);\n  alert(V ? fillTpl($('te_text').value,V) : '請先完成計算才能預覽。');\n}\nfunction saveTpl(asNew){\n  const name=$('te_name').value.trim()||'我的模板', text=$('te_text').value;\n  if(!text.trim()) return alert('模板內容不能空白。');\n  if(EDIT_IDX>0 && !asNew){ TPL.list[EDIT_IDX-1]={name,text}; TPL.sel=EDIT_IDX; }\n  else { TPL.list.push({name,text}); TPL.sel=TPL.list.length; }\n  TPL.ts=Date.now(); tplStoreLocal(); renderTplSel(); closeTplEditor(); regenReport(true);\n  if(TPL.email) cloudSync('save'); else msg('✓ 已存在本機。登入 Google 可跨電腦使用。');\n}\nfunction delTpl(){\n  if(!(EDIT_IDX>0) || !confirm(`刪除模板「${TPL.list[EDIT_IDX-1].name}」？`)) return;\n  TPL.list.splice(EDIT_IDX-1,1); TPL.sel=0; TPL.ts=Date.now();\n  tplStoreLocal(); renderTplSel(); closeTplEditor(); regenReport(true);\n  if(TPL.email) cloudSync('save');\n}\nfunction msg(t,bad){ $('rptMsg').textContent=t; $('rptMsg').style.color=bad?'var(--bad)':'var(--ok)'; }\n\n/* ---------- Google 雲端（Apps Script，以使用者本人身分執行） ---------- */\nlet SYNC=null;\nfunction cloudSync(action){\n  if(!TPL.gasUrl){\n    const u=prompt('請貼上「模板雲端同步」的 Apps Script 網址（https://script.google.com/macros/s/…/exec）：','');\n    if(!u) return;\n    if(!/^https:\\/\\/script\\.google\\.com\\/(a\\/[^/]+\\/)?macros\\/s\\/[\\w-]+\\/exec/.test(u.trim())) return alert('網址格式不正確。');\n    TPL.gasUrl=u.trim(); tplStoreLocal();\n  }\n  const nonce=Math.random().toString(36).slice(2)+Date.now();\n  const w=window.open('','vanco_gsync','width=480,height=600');\n  if(!w) return msg('彈出視窗被瀏覽器封鎖，請允許後再試。',true);\n  const f=document.createElement('form');\n  f.method='POST'; f.action=TPL.gasUrl; f.target='vanco_gsync'; f.style.display='none';\n  const add=(k,v)=>{ const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=v; f.appendChild(i); };\n  add('action',action); add('nonce',nonce);\n  if(action==='save') add('data',JSON.stringify({list:TPL.list,sel:TPL.sel,ts:TPL.ts}));\n  document.body.appendChild(f); f.submit(); f.remove();\n  SYNC={nonce,win:w,action};\n  msg(action==='save'?'☁ 上傳中…（首次使用需在彈出視窗授權）':'☁ 連線 Google 中…（首次使用需在彈出視窗授權）');\n}\naddEventListener('message',e=>{\n  const d=e.data;\n  if(!d||d.type!=='vanco-sync'||!SYNC||d.nonce!==SYNC.nonce) return;\n  try{ SYNC.win.close(); }catch(_){}\n  const action=SYNC.action; SYNC=null;\n  if(!d.ok) return msg('☁ 同步失敗：'+(d.error||'未知錯誤'),true);\n  TPL.email=d.email||'(已登入)';\n  if(action==='load'){\n    let cloud=null; try{ cloud=d.data?JSON.parse(d.data):null; }catch(_){}\n    if(cloud && Array.isArray(cloud.list)){\n      if(TPL.list.length && JSON.stringify(TPL.list)!==JSON.stringify(cloud.list) && (TPL.ts||0)>(cloud.ts||0)\n         && confirm('本機的模板比雲端新，要上傳本機模板覆蓋雲端嗎？\\n（取消＝改用雲端模板）')){\n        tplStoreLocal(); renderTplSel(); return cloudSync('save');\n      }\n      TPL.list=cloud.list; TPL.ts=cloud.ts||0;\n      TPL.sel = (cloud.sel>0 && cloud.sel<=TPL.list.length) ? cloud.sel : 0;\n      msg(`☁ 已載入雲端模板 ${TPL.list.length} 個`);\n    }else if(TPL.list.length){\n      tplStoreLocal(); renderTplSel(); return cloudSync('save');      // 雲端還沒有 → 上傳本機\n    }else msg('☁ 已登入，雲端尚無模板');\n    tplStoreLocal(); renderTplSel(); regenReport(true);\n  }else{ tplStoreLocal(); renderTplSel(); msg('☁ 已儲存到 Google 雲端'); }\n});\nfunction cloudLogout(){\n  if(!confirm('登出會清除這台電腦上的模板副本（雲端仍保留，下次登入即可取回）。確定登出？')) return;\n  TPL.email=''; TPL.list=[]; TPL.sel=0; TPL.ts=0; tplStoreLocal(); renderTplSel(); regenReport(true); msg('已登出');\n}\n\n/* ---------- 視窗 ---------- */\nlet RPT_DIRTY=false;\nfunction openReport(ctx){\n  RPT_CTX=ctx; msg('');\n  tplLoad(); renderTplSel(); closeTplEditor();\n  $('ro_date').value = (ctx==='sst'?$('s_d2').value : ctx==='pt'?$('q_d2').value : '') || today();\n  $('rptText').value=buildReport(ctx); RPT_DIRTY=false;\n  $('rptBox').classList.add('on');\n}\nfunction regenReport(force){\n  if(RPT_DIRTY && force!==true && !confirm('重新產生會覆蓋目前修改的內容，確定嗎？')) return;\n  $('rptText').value=buildReport(RPT_CTX); RPT_DIRTY=false;\n}\nfunction closeReport(){ $('rptBox').classList.remove('on'); }\nasync function copyReport(){\n  const t=$('rptText');\n  try{ await navigator.clipboard.writeText(t.value); }\n  catch(e){ t.select(); document.execCommand('copy'); }\n  msg('✓ 已複製');\n}\n\n/* ===== 方案比較 ===== */\nfunction addCompare(ctx){\n  if(!S[ctx].pk) return;\n  const dose=num(IN[ctx][0]), tau=parseFloat($(IN[ctx][1]).value);\n  if(!(dose>0&&tau>0)) return;\n  if(!S[ctx].list.some(x=>x.dose===dose&&x.tau===tau)) S[ctx].list.push({dose,tau});\n  renderCompare(ctx);\n}\nfunction removeCompare(ctx,i){ S[ctx].list.splice(i,1); renderCompare(ctx); }\nfunction clearCompare(ctx){ S[ctx].list=[]; renderCompare(ctx); }\nfunction renderCompare(ctx){\n  useRate(ctx);\n  const st=S[ctx], pk=st.pk, el='cmp_'+ctx, ne='cmpNote_'+ctx;\n  if(!pk||!st.list.length){ $(el).innerHTML=''; $(ne).innerHTML=''; redrawChart(ctx); return; }\n  const wt = ctx==='init'?(patientOK('')?base('').wt:NaN):(patientOK('t_')&&ctx==='sst'?base('t_').wt:NaN);\n  const rows=st.list.map(({dose,tau})=>{\n    const {ti,Cmax,Cmin}=ss(dose,tau,pk.Ke,pk.Vd);\n    const a=auc24(dose,tau,pk.Ke,pk.Vd,pk.CL);\n    const iss=[];\n    if(tau===8 && dose/wt>18) iss.push('>18 mg/kg q8h');\n    if(dose*(24/tau)>4000) iss.push('日劑量 >4 g');\n    if(a>700) iss.push('AUC >700');\n    if(Cmax>40) iss.push('Peak >40');\n    const g=goal(ctx);\n    const inGoal = a>=400&&a<=600;\n    if(Cmin<g.lo) iss.push('Trough 偏低'); else if(Cmin>g.hi) iss.push('Trough 偏高');\n    return {dose,tau,ti,Cmax,Cmin,auc:a,iss,feasible:inGoal&&dose*(24/tau)<=4000&&Cmax<=40};\n  });\n  $(el).innerHTML='<tr><th>方案<\/th><th>每日總量<\/th><th>輸注速率<\/th><th>T_inf<\/th><th>Peak_ss<\/th><th>Trough_ss<\/th><th>AUC₂₄<\/th><th>評估<\/th><th><\/th><\/tr>'+\n    rows.map((x,i)=>{\n      const tag=!x.feasible?'<span class=\"tag t-bad\">未達目標<\/span>'\n        : x.iss.length?`<span class=\"tag t-warn\">${x.iss[0]}<\/span>` : '<span class=\"tag t-ok\">適用<\/span>';\n      return `<tr class=\"${x.feasible&&!x.iss.length?'best':(x.feasible?'':'bad')}\">`+\n        `<td class=\"v\">${x.dose} mg q${x.tau}h<\/td><td class=\"v\">${r(x.dose*24/x.tau,0)} mg<\/td>`+\n        `<td class=\"v\">${r(effRate(x.dose),0)} mg/hr<\/td><td class=\"v\">${r(x.ti,1)} hr<\/td>`+\n        `<td class=\"v\">${r(x.Cmax,1)}<\/td><td class=\"v\">${r(x.Cmin,1)}<\/td><td class=\"v\">${r(x.auc,0)}<\/td>`+\n        `<td>${tag}<\/td><td><button class=\"ghost sm\" onclick=\"removeCompare('${ctx}',${i})\">移除<\/button><\/td><\/tr>`;\n    }).join('');\n  $(ne).innerHTML=`<div class=\"btnrow\" style=\"margin:10px 0 0\"><button class=\"ghost\" onclick=\"clearCompare('${ctx}')\">清空比較<\/button><\/div>`;\n  redrawChart(ctx);\n}\n\n/* ===== 濃度-時間曲線 ===== */\nconst SERIES_COLORS=['#0e6f8f','#b45309','#0f7b4f','#b91c1c','#6d28d9','#0891b2','#be185d','#4d7c0f'];\nfunction seriesCurve(pk,dose,tau,LD,gap,tEnd){\n  const {Ke,Vd}=pk, events=[]; let t0=0;\n  if(LD>0){ event
